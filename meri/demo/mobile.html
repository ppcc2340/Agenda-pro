<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meri: demo móvil</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEF1; --panel:#F5F8F9; --raised:#FFFFFF;
  --ink:#0F1E2E; --ink2:#44566A; --ink3:#74869A; --rule:#D2DBE1;
  --rail:#0F1E2E; --rail-ink:#C9DBE2; --rail-dim:#7F97A6;
  --sea:#0E6B74; --on-sea:#FFFFFF; --sea-soft:#D5EBED;
  --risk:#BF3A4A; --risk-soft:#F7DEE1;
  --sug:#9A6A0C; --sug-soft:#FAEFD4;
  --ok:#2A7B58; --ok-soft:#D9EFE5;
  --c-acme:#3A6EDB; --c-norte:#2F8A5C; --c-luna:#B07414; --c-beta:#B0407E;
  --f-head:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#08121A; --panel:#0F1C27; --raised:#142431;
    --ink:#E7EFF3; --ink2:#A7B9C6; --ink3:#7C91A1; --rule:#233545;
    --rail:#060E15; --rail-ink:#C9DBE2; --rail-dim:#6F8796;
    --sea:#5CC9CF; --on-sea:#06242A; --sea-soft:#12363C;
    --risk:#F0707F; --risk-soft:#3A1B22;
    --sug:#E3B04B; --sug-soft:#35290F;
    --ok:#5CC79B; --ok-soft:#123428;
    --c-acme:#7AA2F5; --c-norte:#5CC79B; --c-luna:#E3A64B; --c-beta:#E27BB0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08121A; --panel:#0F1C27; --raised:#142431;
  --ink:#E7EFF3; --ink2:#A7B9C6; --ink3:#7C91A1; --rule:#233545;
  --rail:#060E15; --rail-ink:#C9DBE2; --rail-dim:#6F8796;
  --sea:#5CC9CF; --on-sea:#06242A; --sea-soft:#12363C;
  --risk:#F0707F; --risk-soft:#3A1B22;
  --sug:#E3B04B; --sug-soft:#35290F;
  --ok:#5CC79B; --ok-soft:#123428;
  --c-acme:#7AA2F5; --c-norte:#5CC79B; --c-luna:#E3A64B; --c-beta:#E27BB0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 14.5px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-head);margin:0;letter-spacing:-.01em;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}

.btn{font:600 13.5px var(--f-body);padding:8px 14px;border-radius:9px;border:1px solid var(--rule);background:var(--raised);color:var(--ink);display:inline-flex;align-items:center;gap:7px;line-height:1.2}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--sea);border-color:var(--sea);color:var(--on-sea)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.quiet:hover{background:var(--sea-soft);color:var(--ink)}
.btn.risk{border-color:var(--risk);color:var(--risk)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:3px;background:var(--cc);display:inline-block}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--sea-soft);color:var(--sea)}
.pill.risk{background:var(--risk-soft);color:var(--risk)}
.pill.sug{background:var(--sug-soft);color:var(--sug);border:1px dashed var(--sug)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.plain{background:transparent;border:1px solid var(--rule);color:var(--ink2)}
.muted{color:var(--ink2)} .dim{color:var(--ink3)}
.conf{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.conf span{width:44px;height:5px;border-radius:9px;background:var(--rule);overflow:hidden;display:inline-block}
.conf span b{display:block;height:100%;background:var(--sea)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13.5px;max-width:92vw}
.toast[hidden]{display:none}
.toast .link{background:none;border:0;color:var(--sea-soft);font-weight:700;text-decoration:underline;padding:0}
:root[data-theme="dark"] .toast .link,:root:not([data-theme="light"]) .toast .link{color:var(--sea)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.stage{min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 600px at 50% -10%,var(--sea-soft),transparent 60%),var(--bg)}
.phone{position:relative;width:390px;height:820px;max-height:calc(100dvh - 48px);background:var(--panel);border-radius:48px;border:10px solid #0A141C;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 70px rgba(8,18,26,.35)}
.sbar{height:40px;flex-shrink:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 6px;font-weight:600;font-size:13px}
.screen{flex:1;overflow:auto;padding:6px 20px 120px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
@media (max-width:520px){
  .stage{padding:0;display:block}
  .phone{width:100%;height:100dvh;max-height:none;border:0;border-radius:0}
  .sbar{display:none}
  .screen{padding-top:calc(14px + env(safe-area-inset-top,0px))}
}
.tabbar{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--raised);border-top:1px solid var(--rule);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--ink3);padding:6px 0;position:relative}
.tabbar button[aria-current="page"]{color:var(--sea)}
.tabbar .bdg{position:absolute;top:1px;left:calc(50% + 7px);background:var(--sea);color:var(--on-sea);font-size:11px;font-weight:700;border-radius:99px;padding:0 6px;min-width:18px;text-align:center}
.tabbar .bdg.r{background:var(--risk);color:#fff}
.fab{position:absolute;right:18px;bottom:84px;width:54px;height:54px;border-radius:18px;border:0;background:var(--sea);color:var(--on-sea);font-size:30px;line-height:1;box-shadow:0 8px 22px rgba(14,107,116,.4);display:grid;place-items:center;z-index:5;padding:0 0 3px}
.phone .toast{position:absolute;bottom:92px;left:16px;right:16px;transform:none;max-width:none;justify-content:space-between}

.mh h1{font-size:28px;line-height:1.1;margin-top:6px}
.mh p{color:var(--ink2);margin-top:6px}
.mh .back{background:none;border:0;display:flex;align-items:center;gap:4px;color:var(--sea);font-weight:600;padding:4px 0 10px 0}
.msec{margin-top:24px}
.msec>h2{font-size:17px;margin-bottom:8px}
.card{background:var(--raised);border:1px solid var(--rule);border-radius:16px;padding:16px}
.now-m{border-left:5px solid var(--cc)}
.now-m h3{font-size:21px;margin:4px 0 4px}
.bar{height:6px;border-radius:9px;background:var(--rule);overflow:hidden;margin:12px 0 14px}
.bar b{display:block;height:100%;background:var(--cc)}
.btn.block{width:100%;justify-content:center;padding:12px 14px;font-size:15px;border-radius:12px}
.lrow{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--rule)}
.lrow:last-child{border-bottom:0}
.lrow .grow{flex:1;min-width:0}
.lrow .t{font-weight:600}
.lrow .m{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--ink2);font-size:13px;margin-top:3px}
.risk-m{border-left:3px solid var(--risk);padding-left:12px}
.check{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--ink3);background:var(--raised);display:grid;place-items:center;flex-shrink:0;color:transparent;padding:0}
.check.on{background:var(--sea);border-color:var(--sea);color:var(--on-sea)}
.dim-done .t{text-decoration:line-through;color:var(--ink3)}

.pcard{background:var(--raised);border:1px solid var(--rule);border-left:3px dashed var(--sug);border-radius:16px;padding:15px;margin-top:12px}
.pcard .t{font-weight:600;font-size:16px}
.pcard .q{font-style:italic;color:var(--ink2);margin-top:8px;padding-left:10px;border-left:2px solid var(--rule);font-size:14px}
.pcard .src{font-size:12.5px;color:var(--ink3);margin-top:6px}
.pcard .acts{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:14px}
.pcard input{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--rule);border-radius:10px;background:var(--panel);color:var(--ink);margin-top:6px}

.seg{display:flex;border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--raised);margin-top:14px}
.seg button{flex:1;background:none;border:0;padding:10px 6px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--sea);color:var(--on-sea)}
.fscroll{display:flex;gap:8px;overflow-x:auto;margin:12px -20px 0;padding:0 20px 4px;scrollbar-width:none}
.fscroll::-webkit-scrollbar{display:none}
.fchip{flex-shrink:0;border:1px solid var(--rule);background:var(--raised);border-radius:99px;padding:6px 12px;display:inline-flex;gap:6px;align-items:center;font-size:13px}
.fchip i{width:9px;height:9px;border-radius:3px;background:var(--cc)}
.fchip[aria-pressed="true"]{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,var(--raised))}

.dstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.dstrip button{border:1px solid var(--rule);background:var(--raised);border-radius:12px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;color:var(--ink2)}
.dstrip button b{font:600 17px var(--f-head);color:var(--ink)}
.dstrip button[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--on-sea)}
.dstrip button[aria-pressed="true"] b{color:var(--on-sea)}
.ag{position:relative;margin-top:16px}
.ag .it{display:grid;grid-template-columns:48px 1fr;gap:10px;margin-bottom:10px}
.ag .tm{font-size:12.5px;color:var(--ink3);padding-top:9px;text-align:right}
.ag .bx{border-radius:12px;padding:9px 12px;border-left:4px solid var(--cc);background:color-mix(in srgb,var(--cc) 15%,var(--raised))}
.ag .bx.fx{background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--cc) 28%,transparent) 6px 7px);border:1px solid var(--cc);border-left-width:4px}
.ag .bx.dn{opacity:.5}.ag .bx.dn b{text-decoration:line-through}
.ag .bx b{display:block;font-size:14px}.ag .bx span{font-size:12.5px;color:var(--ink2)}
.ag .nw{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;margin:2px 0 10px}
.ag .nw em{font:700 11px var(--f-body);background:var(--sea);color:var(--on-sea);border-radius:99px;padding:1px 6px;text-align:center;font-style:normal}
.ag .nw div{height:2px;background:var(--sea)}

.mlist button.mr{width:100%;display:flex;align-items:center;gap:14px;padding:14px 2px;background:none;border:0;border-bottom:1px solid var(--rule);text-align:left}
.mlist .mr .grow{flex:1}.mlist .mr small{display:block;color:var(--ink2);font-size:13px}
.stats{display:flex;gap:26px;margin:14px 0 8px}
.stats b{display:block;font:600 26px var(--f-head)}.stats span{font-size:12.5px;color:var(--ink2)}
.meter{height:8px;border-radius:9px;background:var(--rule);overflow:hidden;margin:8px 0 4px}.meter b{display:block;height:100%;background:var(--sea)}
.empty{padding:26px 2px;color:var(--ink2)}.empty h3{font-size:18px;color:var(--ink);margin-bottom:4px}

.sheet-wrap{position:absolute;inset:0;background:rgba(6,14,21,.5);display:flex;align-items:flex-end;z-index:20}
.sheet-wrap[hidden]{display:none}
.sheet{width:100%;max-height:86%;overflow:auto;background:var(--raised);border-radius:24px 24px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:42px;height:4px;border-radius:9px;background:var(--rule);margin:0 auto 14px}
.sheet h2{font-size:21px}.sheet .sub{color:var(--ink2);margin:4px 0 12px}
.sheet textarea{width:100%;min-height:150px;font:inherit;padding:10px 12px;border:1px solid var(--rule);border-radius:12px;background:var(--panel);color:var(--ink);resize:vertical}
.sheet .cin{width:100%;font:500 17px var(--f-body);padding:13px 14px;border:1px solid var(--rule);border-radius:12px;background:var(--panel);color:var(--ink)}
.sheet .chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;min-height:26px}
.sheet .chips .pill{border-style:dashed}
.sheet .foot{display:grid;gap:8px;margin-top:14px}
.diff{padding:12px 0;border-bottom:1px solid var(--rule)}.diff s{color:var(--ink3)}
.diff .ar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:3px;color:var(--ink2);font-size:13.5px}

</style>
</head>
<body>
<div class="stage"><div class="phone" id="phone">
  <div class="sbar" aria-hidden="true"><span class="num">10:40</span><span>Demo</span></div>
  <div class="screen" id="screen"></div>
  <button class="fab" id="fab" data-act="sheet-capture" aria-label="Capturar">+</button>
  <nav class="tabbar" id="tabbar" aria-label="Áreas"></nav>
  <div class="sheet-wrap" id="sheet" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div></div>
<script>
/* ===== Datos de ejemplo y utilidades compartidas (demo de Meri) ===== */
const BASE = new Date(2026, 9, 19);            // lunes 19 de octubre de 2026
const T = (h, m = 0) => h * 60 + m;
const NOW_MIN = T(10, 40);
const hm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const fmtMin = m => m < 60 ? m + ' min' : (Math.round(m / 6) / 10).toString().replace('.', ',') + ' h';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const CLIENTS = {
  acme:  { name: 'Acme Corp',       css: 'var(--c-acme)' },
  norte: { name: 'Estudio Norte',   css: 'var(--c-norte)' },
  luna:  { name: 'Luna Legal',      css: 'var(--c-luna)' },
  beta:  { name: 'Beta Logística',  css: 'var(--c-beta)' },
};
const cc = c => c ? CLIENTS[c].css : 'var(--ink3)';
const chip = c => c ? `<span class="chip" style="--cc:${CLIENTS[c].css}"><i></i>${esc(CLIENTS[c].name)}</span>` : '';

const IC = {
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  inbox:'<path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 3h6l1-3h5"/>',
  layers:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  sliders:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  edit:'<path d="M4 20h4l11-11-4-4L4 16z"/>',
  search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>',
  alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/>',
  moon:'<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
  more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  chev:'<path d="M9 5l7 7-7 7"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.5 3-5.5 6.5-5.5s5.9 2 6.5 5.5"/><path d="M16 5a3.5 3.5 0 010 6.5M18 14.8c2 .6 3.3 2.4 3.7 5.2"/>',
  download:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
};
const ic = (n, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const LOGO = (s = 26) => `<svg width="${s}" height="${s}" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--sea)"/><path d="M5 13c3.5-3 7-3 10.5 0s7 3 11.5 0" stroke="var(--on-sea)" stroke-width="2.4" stroke-linecap="round"/><path d="M5 20c3.5-3 7-3 10.5 0s7 3 11.5 0" stroke="var(--on-sea)" stroke-width="2.4" stroke-linecap="round" opacity=".55"/></svg>`;

const S = {
  events: [
    { id:'e1', title:'Llamada semanal con Acme',               client:'acme',  s:T(9,30),  e:T(10,15) },
    { id:'e2', title:'Almuerzo',                                client:null,    s:T(12,30), e:T(13,30), personal:true },
    { id:'e3', title:'Reunión de estrategia con Estudio Norte', client:'norte', s:T(16,30), e:T(17,30) },
  ],
  blocks: [
    { id:'b1', title:'Responder consultas de Luna',        client:'luna',  s:T(8,45),  e:T(9,30),  kind:'shallow', pri:3, done:true,  why:'Prioridad alta y cabía antes de la llamada con Acme.' },
    { id:'b2', title:'Informe trimestral de Acme',         client:'acme',  s:T(10,30), e:T(12,30), kind:'deep',    pri:1, done:false, why:'Vence el jueves y es tu bloque de concentración más largo de la semana. Lo protegí de reuniones y mensajes.' },
    { id:'b3', title:'Borrador de contestación para Beta', client:'beta',  s:T(13,30), e:T(15,0),  kind:'deep',    pri:1, done:false, why:'Vence el miércoles y todavía necesita 4,5 h. Es la tarea con menos holgura de la semana.' },
    { id:'b4', title:'Revisar factura de Estudio Norte',   client:'norte', s:T(15,0),  e:T(16,0),  kind:'shallow', pri:3, done:false, why:'Es corta y no tiene fecha límite esta semana. Llena el hueco antes de la reunión con Norte.' },
    { id:'b5', title:'Preparar briefing de Luna Legal',    client:'luna',  s:T(17,30), e:T(18,15), kind:'shallow', pri:2, done:false, why:'Mañana tienes comité con Luna. Lo dejo después de la reunión con Norte para que llegues con contexto fresco.' },
  ],
  margin: [{ s:T(16,0), e:T(16,30) }],
  moved: [],
  unscheduled: [],
  risks: [
    { id:'r1', title:'El borrador para Beta vence el miércoles', detail:'Necesitas 4,5 h y solo te quedan 3 h de holgura.', client:'beta', fix:'reorganize' },
    { id:'r2', title:'El briefing de Luna depende de un documento que no llega', detail:'Marta Díaz aún no envía el poder notarial firmado.', client:'luna', fix:'followup', cid:'c5' },

/* ---- Captura en lenguaje natural (reglas; en producto: reglas + IA) ---- */
const WD = [['domingo'], ['lunes'], ['martes'], ['miércoles','miercoles'], ['jueves'], ['viernes'], ['sábado','sabado']];
const fmtDay = d => d.toLocaleDateString('es', { weekday:'long', day:'numeric', month:'short' }).replace('.', '');
function parseCapture(raw) {
  const t = raw.trim(), low = t.toLowerCase();
  const out = { title: t, client: null, due: null, est: null };
  for (const k in CLIENTS) { if (low.includes(CLIENTS[k].name.split(' ')[0].toLowerCase())) { out.client = k; break; } }
  let d = null, word = null;
  if (/\bhoy\b/.test(low)) { d = new Date(BASE); word = 'hoy'; }
  else if (/\bmañana\b|\bmanana\b/.test(low)) { d = new Date(BASE); d.setDate(d.getDate() + 1); word = /\bmañana\b/.test(low) ? 'mañana' : 'manana'; }
  else {
    for (let i = 0; i < 7 && !d; i++) for (const w of WD[i]) {
      if (new RegExp('\\b' + w + '\\b').test(low)) { d = new Date(BASE); d.setDate(d.getDate() + ((i - d.getDay() + 7) % 7 || 7)); word = w; break; }
    }
  }
  if (d) out.due = fmtDay(d);
  const m = low.match(/(\d+(?:[.,]\d+)?)\s*(h|hs|hr|hrs|horas?|min|minutos?)\b/);
  if (m) { const n = parseFloat(m[1].replace(',', '.')); out.est = /^h/.test(m[2]) ? Math.round(n * 60) : Math.round(n); }
  let title = t;
  if (m) title = title.replace(m[0], '');
  if (word) title = title.replace(new RegExp('\\b(el |para el |para )?' + word + '\\b', 'i'), '');
  out.title = title.replace(/\s{2,}/g, ' ').replace(/^[\s,;]+|[\s,;]+$/g, '') || t;
  return out;
}

    + `<p class="dim" style="margin-top:12px;font-size:13px">${ic('shield', 14)} Cada briefing usa solo datos del cliente elegido.</p>`;
  if (more === 'actividad') return back('Actividad') + S.audit.slice(0, 10).map(a => `<div class="lrow"><span class="pill ${a.who === 'ia' ? 'sug' : a.who === 'user' ? 'ok' : 'plain'}">${{ ia:'IA', user:'Tú', sistema:'Sistema' }[a.who]}</span><div class="grow">${esc(a.text)}<div class="dim num" style="font-size:12.5px">${a.time}</div></div>
    ${a.undoable && !a.undone ? `<button class="btn sm" data-act="undo" data-id="${a.id}">Deshacer</button>` : a.undone ? '<span class="dim" style="font-size:13px">Deshecho</span>' : ''}</div>`).join('');
  if (more === 'ajustes') return back('Autonomía y privacidad') + `
    <section class="msec" style="margin-top:6px"><h2>Autonomía</h2><div class="seg" style="margin-top:0"><button data-act="auto" data-v="suggest" aria-pressed="${S.autonomy === 'suggest'}">Solo sugerir</button><button data-act="auto" data-v="low" aria-pressed="${S.autonomy === 'low'}">Bajo riesgo</button></div>
    <p class="muted" style="margin-top:8px;font-size:13.5px">${S.autonomy === 'suggest' ? 'Meri propone y tú confirmas todo.' : 'Meri puede confirmar compromisos explícitos y mover sus bloques. Nunca toca reuniones ni envía correos.'}</p></section>
    <section class="msec"><h2>Conexiones</h2><div class="lrow"><div class="grow"><b>Google Calendar</b><div class="muted" style="font-size:13px">Escribe solo en el calendario «Meri»</div></div><span class="pill sug">Demo</span></div><div class="lrow"><div class="grow"><b>Gmail</b><div class="muted" style="font-size:13px">Lectura y borradores. Sin envío</div></div><span class="pill sug">Demo</span></div></section>
    <section class="msec"><h2>Créditos de IA</h2><div class="num"><b style="font:600 22px var(--f-head)">412</b> <span class="muted">de 1.500 este mes</span></div><div class="meter"><b style="width:27%"></b></div><p class="muted" style="font-size:13px">Al llegar al límite, la IA se pausa y el plan sigue funcionando.</p></section>
    <section class="msec"><h2>Privacidad</h2><div style="display:grid;gap:8px"><button class="btn" data-act="toast-demo" data-m="En el producto real, esto pausa la lectura de correo al instante.">Pausar lectura de correo</button><button class="btn" data-act="toast-demo" data-m="Se descargaría un archivo con todos tus datos.">Exportar mis datos</button><button class="btn risk" data-act="toast-demo" data-m="En la demo no se elimina nada.">Eliminar mi cuenta</button></div></section>`;
}

/* ---------- Hojas ---------- */
function openSheet(html) { const s = $('#sheet'); s.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`; s.hidden = false; }
function closeSheet() { $('#sheet').hidden = true; $('#sheet').innerHTML = ''; }
function sheetCapture() {
  openSheet(`<h2>Capturar</h2><p class="sub">Escribe como hablas. Meri entiende clientes, fechas y duración.</p>
  <input class="cin" id="cap" placeholder="Informe para Acme el jueves, 2 h" autocomplete="off" aria-label="Captura"><div class="chips" id="chips" aria-live="polite"></div>
  <div class="foot"><button class="btn primary block" data-act="capture">${ic('plus', 18)}Añadir a Entrada</button></div>`);
  $('#cap').focus();
}
function chipsUpdate() {
  const q = $('#cap').value.trim(); if (!q) { $('#chips').innerHTML = ''; return; }
  const p = parseCapture(q);
  $('#chips').innerHTML = `<span class="pill sug">${esc(p.title)}</span>${p.client ? chip(p.client) : ''}${p.due ? `<span class="pill sug">Para: ${esc(p.due)}</span>` : ''}${p.est ? `<span class="pill sug">${fmtMin(p.est)}</span>` : ''}`;
}
function sheetReorg() {
  openSheet(`<h2>Proteger la fecha de Beta</h2><p class="sub">Meri propone dos cambios. Ninguna reunión se mueve.</p>
  <div class="diff"><b>Borrador de contestación para Beta</b><div class="ar"><s class="num">13:30 a 15:00</s>${ic('chev', 14)}<b class="num" style="color:var(--ink)">13:30 a 16:00</b><span class="pill ok">+1 h</span></div></div>
  <div class="diff"><b>Revisar factura de Estudio Norte</b><div class="ar"><s class="num">Hoy 15:00 a 16:00</s>${ic('chev', 14)}<b class="num" style="color:var(--ink)">Mañana 09:00</b></div></div>
  <p class="muted" style="margin-top:12px;font-size:14px"><b style="color:var(--ink)">Qué cambia.</b> La holgura de Beta sube de 3 h a 5 h. La factura de Norte no tiene fecha límite esta semana.</p>
  <div class="foot"><button class="btn primary block" data-act="accept-reorg">Aceptar cambios</button><button class="btn block" data-act="close">Ahora no</button></div><p class="dim" style="margin-top:10px;font-size:12.5px;text-align:center">Podrás deshacerlo desde Actividad.</p>`);
}
function sheetFollow(cid) {
  const c = S.commitments.find(x => x.id === cid), d = followupDraft(c);
  openSheet(`<h2>Seguimiento para ${esc(c.who)}</h2><p class="sub">Asunto: ${esc(d.subject)}</p><label class="sr" for="draft">Borrador</label><textarea id="draft">${esc(d.body)}</textarea>
  <div class="foot"><button class="btn primary block" data-act="save-draft" data-id="${c.id}">${ic('mail', 18)}Guardar borrador en Gmail</button><button class="btn block" data-act="remind">Recordarme mañana</button></div><p class="dim" style="margin-top:10px;font-size:12.5px;text-align:center">Meri solo crea borradores. Tú decides cuándo enviarlo.</p>`);
}
function sheetBrief(k) {
  openSheet(`<h2>Briefing de ${esc(CLIENTS[k].name)}</h2><p class="sub">${ic('shield', 14)} Contexto aislado: solo datos de este cliente.</p>
  ${BRIEFS[k].map(([t, kind, src]) => `<div class="lrow"><div class="grow">${esc(t)}<div class="dim" style="font-size:12.5px;margin-top:2px">${kind}: ${esc(src)}</div></div></div>`).join('')}
  <div class="foot"><button class="btn primary block" data-act="close">Cerrar</button></div>`);
}

/* ---------- Acciones ---------- */
const H = {
  tab: d => { tab = d.v; more = null; editing = null; render(); $('#screen').scrollTop = 0; },
  more: d => { more = d.v || null; render(); $('#screen').scrollTop = 0; },
  day: d => { day = +d.v; render(); },
  dir: d => { dir = d.v; render(); },
  cf: d => { cf = d.v || null; render(); },
  done: d => {
    const b = S.blocks.find(x => x.id === d.id); b.done = true;
    S.time.unshift({ id: 't' + (++idN), day: 'Lun 19', client: b.client, desc: b.title, min: b.e - b.s, src: 'Bloque completado', status: 'suggested' });
    audit('user', `Completaste «${b.title}». Meri sugirió ${fmtMin(b.e - b.s)} de tiempo.`);
    render(); toast(`Hecho. Añadí ${fmtMin(b.e - b.s)} sugeridas en Tiempo.`);
  },
  'sheet-capture': () => sheetCapture(),
  capture: () => {
    const q = $('#cap').value.trim(); if (!q) return; const p = parseCapture(q), id = 'p' + (++idN);
    S.proposals.unshift({ id, kind:'capture', client:p.client, action:p.title, due:p.due, est:p.est, conf:null, dir:'owed_by_me', who:'' });
    const aid = audit('user', `Capturaste «${p.title}».`, () => { S.proposals = S.proposals.filter(x => x.id !== id); });
    closeSheet(); render(); toast('Capturado en Entrada. Revisa lo que Meri entendió.', () => H.undo({ id: aid }));
  },
  'sheet-reorg': () => sheetReorg(),
  'accept-reorg': () => {
    const b3 = S.blocks.find(b => b.id === 'b3'), b4 = S.blocks.find(b => b.id === 'b4'), r1 = S.risks.find(r => r.id === 'r1'), oldE = b3.e, oldB4 = { ...b4 };
    b3.e = T(16); S.blocks = S.blocks.filter(b => b.id !== 'b4'); S.moved.push({ ...b4, s: T(9), e: T(10) }); S.risks = S.risks.filter(r => r.id !== 'r1'); S.margin = [];
    const aid = audit('user', 'Aceptaste reorganizar: ampliar el borrador de Beta y mover la factura de Norte a mañana.', () => {
      b3.e = oldE; S.blocks.push(oldB4); S.blocks.sort((a, b) => a.s - b.s); S.moved = S.moved.filter(m => m.id !== 'b4'); S.risks.unshift(r1); S.margin = [{ s: T(16), e: T(16, 30) }];
    });
    closeSheet(); render(); toast('Plan actualizado. La holgura de Beta sube a 5 h.', () => H.undo({ id: aid }));
  },
  undo: d => { const f = undoers[d.id]; if (!f) return; f(); S.audit.find(x => x.id === d.id).undone = true; delete undoers[d.id]; render(); toast('Deshecho.'); },
  confirm: d => {
    const p = S.proposals.find(x => x.id === d.id);
    if (p.kind === 'capture') S.unscheduled.push({ title: p.action, client: p.client, due: p.due, est: p.est });
    else S.commitments.unshift({ id: 'c' + (++idN), dir: p.dir, client: p.client, action: p.action, who: p.who, due: p.due, status: 'confirmed' });
    S.proposals = S.proposals.filter(x => x.id !== p.id); audit('user', `Confirmaste «${p.action}».`); editing = null; render();
    toast(p.kind === 'capture' ? 'Añadida. Meri la programará en el siguiente hueco.' : 'Confirmado. Ya está en tus compromisos.');
  },
  dismiss: d => { const p = S.proposals.find(x => x.id === d.id); S.proposals = S.proposals.filter(x => x.id !== d.id); audit('user', `Descartaste «${p.action}». Meri aprenderá de esto.`); render(); toast('Descartada. Meri aprenderá de esto.'); },
  edit: d => { editing = d.id; render(); },
  cancel: () => { editing = null; render(); },
  save: d => { const p = S.proposals.find(x => x.id === d.id); p.action = $('#e-action').value.trim() || p.action; p.due = $('#e-due').value.trim(); editing = null; H.confirm({ id: p.id }); },
  fulfil: d => { const c = S.commitments.find(x => x.id === d.id); S.commitments = S.commitments.filter(x => x.id !== c.id); audit('user', `Marcaste como cumplido «${c.action}».`); render(); toast('Cumplido. Cuenta para tu informe de valor.'); },
  'sheet-follow': d => sheetFollow(d.id),
  'save-draft': d => { const c = S.commitments.find(x => x.id === d.id); audit('ia', `Preparó un borrador de seguimiento para ${c.who}.`); closeSheet(); toast('Borrador guardado en Gmail. Meri no envía correos.'); },
  remind: () => { closeSheet(); toast('Te lo recordaré mañana a las 9:00.'); },
  'sheet-brief': d => sheetBrief(d.v),
  approve: d => { S.time.find(t => t.id === d.id).status = 'approved'; render(); },
  'approve-all': () => { S.time.forEach(t => { if (t.status === 'suggested') t.status = 'approved'; }); audit('user', 'Aprobaste todo el tiempo sugerido.'); render(); toast('Todo el tiempo sugerido quedó aprobado.'); },
  csv: () => { downloadText('meri-tiempo.csv', csvOf(S.time.filter(t => t.status === 'approved'))); toast('Exportadas las entradas aprobadas.'); },
  auto: d => { S.autonomy = d.v; audit('user', d.v === 'suggest' ? 'Cambiaste la autonomía a «Solo sugerir».' : 'Cambiaste la autonomía a «Bajo riesgo».'); render(); },
  close: () => closeSheet(),
  'toast-demo': (d, b) => toast(b.dataset.m),
  'toast-undo': () => { const f = tUndo; $('#toast').hidden = true; if (f) f(); },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b) { H[b.dataset.act]?.(b.dataset, b, e); return; }
  if (e.target.id === 'sheet') closeSheet();
});
document.addEventListener('input', e => { if (e.target.id === 'cap') chipsUpdate(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if (e.key === 'Enter' && e.target.id === 'cap') { e.preventDefault(); H.capture(); }
});
render();

</script>
</body>
</html>
