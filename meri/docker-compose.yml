services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: meri
      POSTGRES_PASSWORD: meri
      POSTGRES_DB: meri
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]
volumes:
  pgdata:
