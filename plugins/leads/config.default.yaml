# ─────────────────────────────────────────────────────────────────────
#  Configuración del motor de leads. Edita solo este archivo.
# ─────────────────────────────────────────────────────────────────────

negocio:
  nombre: "Mi Empresa"
  remitente: "Juan Pérez"
  servicio: "desarrollo de sitios web y automatización de procesos"
  telefono: "+56 9 1234 5678"
  web: "https://miempresa.cl"

# Qué buscar y dónde. Cada búsqueda = rubro + ciudad.
busquedas:
  - rubro: "clínica dental"
    ciudad: "Santiago, Chile"
  - rubro: "estudio jurídico"
    ciudad: "Valparaíso, Chile"
    plantilla: presentacion-servicios   # opcional: plantilla distinta para esta búsqueda

# Fuentes activas: google, maps, instagram
fuentes: [google, maps, instagram]

# Máximo de resultados por fuente y por búsqueda
max_por_fuente: 20

# Si un lead tiene sitio web pero no correo, lo visita para buscar el correo
buscar_correo_en_web: true

correo:
  # Cómo se envían y leen los correos:
  #   gmail → a través del conector de Gmail de Claude (sin contraseñas; Claude envía y lee)
  #   smtp  → directo desde este programa con EMAIL_USER / EMAIL_PASS del .env
  modo: gmail

  # Plantilla por defecto. Están en la carpeta plantillas/ (una por archivo, edítalas
  # libremente o crea nuevas). Cada búsqueda puede indicar su propia "plantilla:".
  plantilla: propuesta-breve

  max_por_dia: 40            # límite diario de envíos (protege tu reputación)
  segundos_entre_envios: 45  # pausa entre correos (solo modo smtp)
  personalizar_con_ia: false # true = Claude redacta un primer párrafo a medida (requiere ANTHROPIC_API_KEY)

excel:
  archivo: "leads.xlsx"
