name: CodeQL

# Static analysis of the TypeScript sources (ADR 0007, P5-06). Results land in the repository's code scanning
# alerts. On a private repository this needs GitHub Advanced Security enabled (docs/blockers: human action).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: CodeQL (javascript-typescript, security-extended)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths:
              - meri/apps
              - meri/packages
              - meri/scripts
            paths-ignore:
              - "**/node_modules"
              - "**/*.test.ts"
              - "**/e2e/**"
              - "**/.next"
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
