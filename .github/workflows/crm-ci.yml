name: CRM · CI
on:
  push:
    paths: ["crm/**", ".github/workflows/crm-ci.yml"]
  pull_request:
    paths: ["crm/**", ".github/workflows/crm-ci.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crm/package-lock.json
      - run: npm ci
      - name: Tipos, pruebas y build
        run: npm run verify
      - name: Dependencias con vulnerabilidades altas
        run: npm audit --omit=dev --audit-level=high
  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t crm-interno:ci crm
      - name: Arranca y responde
        run: |
          docker run -d --name crm -e ADMIN_PASSWORD=Ci-Password-1234 -p 3000:3000 crm-interno:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/health && exit 0; sleep 2; done
          docker logs crm; exit 1
