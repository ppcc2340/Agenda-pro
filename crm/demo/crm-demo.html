PAGES.formularios = () => {
  setHead({ title: 'Formularios web', desc: 'Captura de leads: página propia o embebido con un script. Cada envío crea o actualiza el contacto, asigna propietario, crea la tarea de llamada, notifica y dispara las automatizaciones.', toolbar: `<button class="btn primary" data-act="form-new">${ico.plus}Nuevo formulario</button>` });
  document.getElementById('content').innerHTML = `<div class="charts">${S.forms.map((f) => `<div class="chart"><div class="row"><h3 class="grow" style="margin:0">${esc(f.name)}</h3><span class="tag">${S.submissions.filter((s) => s.formId === f.id).length} envíos</span></div><p class="small muted mt8">Campos: ${f.fields.map((x) => x.label).join(', ')} · asignación ${f.assign === 'rr' ? 'round-robin' : esc(user(f.assign)?.name || '')}${f.task ? ' · crea tarea de llamada' : ''}${f.tags.length ? ' · etiquetas ' + f.tags.join(', ') : ''}</p><div class="row wrap mt12"><button class="btn primary sm" data-act="form-open" data-arg="${f.id}">${ico.link}Abrir formulario público</button><button class="btn sm outline" data-act="form-edit" data-arg="${f.id}">Editar</button><button class="btn sm outline" data-act="form-embed" data-arg="${f.id}">Código embed</button></div><h3 class="mt12" style="font-size:13px">Últimos envíos</h3>${S.submissions.filter((s) => s.formId === f.id).slice(0, 5).map((s) => `<div class="rel"><a href="#/contactos/${s.contactId}" class="grow">${esc(s.data.name || s.data.email)}</a><span class="xs muted">${esc(s.data.utm_source ? 'utm: ' + s.data.utm_source : '')}</span><span class="xs muted">${rel(s.at)}</span></div>`).join('') || '<p class="xs muted">Ninguno aún.</p>'}</div>`).join('')}</div>`;
};
ACT['form-embed'] = (id) => { const f = S.forms.find((x) => x.id === id); modal({ title: 'Insertar en tu web', body: `<pre class="small" style="white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:6px">&lt;script src="https://crm.tuempresa.com/embed.js" data-form="${esc(f.slug)}"&gt;&lt;/script&gt;</pre><p class="small muted">En la versión servidor el formulario se sirve en <code>/f/${esc(f.slug)}</code> y acepta parámetros UTM en la URL.</p>` }); };
ACT['form-new'] = () => formBuilder(null);
ACT['form-edit'] = (id) => formBuilder(S.forms.find((x) => x.id === id));
function formBuilder(f) {
  const d = f ? JSON.parse(JSON.stringify(f)) : { name: 'Solicitud de información', slug: 'contacto', fields: [{ key: 'name', label: 'Nombre y apellidos', req: true }, { key: 'email', label: 'Email', req: true }, { key: 'phone', label: 'Teléfono', req: false }, { key: 'company', label: 'Empresa', req: false }, { key: 'message', label: 'Mensaje', req: false }], assign: 'rr', task: true, tags: ['web'], thanks: '¡Gracias! Te contactaremos en menos de 24 horas.', consent: true };
  const m = modal({ title: f ? 'Editar formulario' : 'Nuevo formulario', body: `<div class="fgrid"><div class="fld"><label>Nombre</label><input class="inp" id="n" value="${esc(d.name)}"/></div><div class="fld"><label>Slug (URL)</label><input class="inp" id="s" value="${esc(d.slug)}"/></div><div class="fld full"><label>Campos (clave:etiqueta:obligatorio, una por línea)</label><textarea class="inp" id="fs" style="min-height:120px">${d.fields.map((x) => `${x.key}:${x.label}:${x.req ? 'si' : 'no'}`).join('\n')}</textarea></div><div class="fld"><label>Asignar a</label><select class="inp" id="a"><option value="rr" ${d.assign === 'rr' ? 'selected' : ''}>Round-robin entre comerciales</option>${S.users.filter((u) => u.active).map((u) => `<option value="${u.id}" ${d.assign === u.id ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}</select></div><div class="fld"><label>Etiquetas (coma)</label><input class="inp" id="t" value="${esc(d.tags.join(', '))}"/></div><div class="fld full"><label>Mensaje de gracias</label><input class="inp" id="th" value="${esc(d.thanks)}"/></div><label class="chk"><input type="checkbox" id="tk" ${d.task ? 'checked' : ''}/>Crear tarea «llamar en 1 h»</label><label class="chk"><input type="checkbox" id="c" ${d.consent ? 'checked' : ''}/>Pedir consentimiento RGPD</label></div>`, footer: `<button class="btn primary" id="ok">Guardar</button>` });
  m.querySelector('#ok').onclick = () => { d.name = m.querySelector('#n').value; d.slug = m.querySelector('#s').value; d.fields = m.querySelector('#fs').value.split('\n').map((l) => l.split(':')).filter((p) => p[0]).map(([key, label, req]) => ({ key: key.trim(), label: (label || key).trim(), req: (req || '').trim() === 'si' })); d.assign = m.querySelector('#a').value; d.tags = m.querySelector('#t').value.split(',').map((x) => x.trim()).filter(Boolean); d.thanks = m.querySelector('#th').value; d.task = m.querySelector('#tk').checked; d.consent = m.querySelector('#c').checked; if (f) Object.assign(f, d); else S.forms.unshift({ ...d, id: uid() }); m.close(); refresh(); };
}
ACT['form-open'] = (id) => { const f = S.forms.find((x) => x.id === id); const m = modal({ title: 'Vista pública · ' + esc(f.name), body: `<div class="pub"><div class="form"><h2 style="font-size:20px">${esc(f.name)}</h2><p class="muted small mb12">Déjanos tus datos y te llamamos.</p><form id="pf" class="col">${f.fields.map((x) => `<div class="fld"><label>${esc(x.label)}${x.req ? ' *' : ''}</label>${x.key === 'message' ? `<textarea class="inp" name="${x.key}" ${x.req ? 'required' : ''}></textarea>` : `<input class="inp" name="${x.key}" type="${x.key === 'email' ? 'email' : 'text'}" ${x.req ? 'required' : ''}/>`}</div>`).join('')}<div class="fld"><label>UTM source (simula ?utm_source=)</label><input class="inp" name="utm_source" value="google"/></div>${f.consent ? '<label class="chk"><input type="checkbox" name="consent"/>Acepto recibir comunicaciones comerciales</label>' : ''}<button class="btn primary" style="justify-content:center">Enviar</button></form></div></div>` }); m.querySelector('#pf').onsubmit = (e) => { e.preventDefault(); const data = Object.fromEntries(new FormData(e.target).entries()); const r = submitForm(f, data); m.querySelector('.form').innerHTML = `<div style="text-align:center;padding:20px"><div style="font-size:40px">✅</div><p>${esc(f.thanks)}</p><p class="small muted">Contacto ${r.existing ? 'actualizado' : 'creado'} y asignado a <b>${esc(user(r.contact.owner)?.name)}</b>${f.task ? ', tarea de llamada creada' : ''}, notificación enviada y automatizaciones disparadas.</p><a href="#/contactos/${r.contact.id}" class="btn primary" style="display:inline-flex">Ver el contacto</a></div>`; refresh(); }; };
function submitForm(f, data) {
  const email = (data.email || '').toLowerCase().trim(); let c = email ? S.contacts.find((x) => x.email === email) : null; const existing = !!c;
  const [firstName, ...rest] = (data.name || data.first_name || email.split('@')[0] || 'Lead').split(' ');
  if (!c) c = createContact({ firstName, lastName: rest.join(' '), email, phone: data.phone, companyName: data.company, source: 'web', owner: f.assign === 'rr' ? roundRobin() : f.assign, tags: f.tags, consent: data.consent === 'on', utm: data.utm_source ? { utm_source: data.utm_source } : {} }, { force: true, silent: true });
  else { if (data.phone && !c.phone) c.phone = normPhone(data.phone); c.tags = [...new Set([...(c.tags || []), ...f.tags])]; if (data.consent === 'on') { c.consent = true; c.consentAt = nowISO(); } }
  S.submissions.unshift({ id: uid(), formId: f.id, contactId: c.id, at: nowISO(), data });
  logActivity({ type: 'system', subject: `Formulario enviado: ${f.name}`, body: data.message || '', user: null, contactId: c.id });
  if (f.task) createTask({ title: 'Llamar al nuevo lead en 1 h', type: 'call', priority: 'high', due: dayISO(), assignee: c.owner, contactId: c.id, companyId: c.companyId });
  notify(c.owner, `Nuevo lead: ${contactName(c)}`, `Formulario ${f.name}${data.company ? ' · ' + data.company : ''}`, `#/contactos/${c.id}`, 'lead');
  if (!existing) emit('created', 'contacts', c); emit('form', 'contacts', c); audit('contacts', c.id, existing ? 'update' : 'create', { formulario: f.name });
  return { contact: c, existing };
}
/* ---------- formularios de alta ---------- */
ACT['new-contact'] = () => contactForm({}); ACT['new-company'] = () => companyForm({}); ACT['new-deal'] = () => dealForm({}); ACT['new-task'] = () => taskForm({}); ACT['new-ticket'] = () => ticketForm({});
const userSel = (id, sel) => `<select class="inp" id="${id}"><option value="">Sin asignar</option>${S.users.filter((u) => u.active).map((u) => `<option value="${u.id}" ${sel === u.id ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}</select>`;
const companySel = (id, sel) => `<select class="inp" id="${id}"><option value="">— Ninguna —</option>${S.companies.map((c) => `<option value="${c.id}" ${sel === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>`;
const opts = (def, sel) => Object.entries(def).map(([k, o]) => `<option value="${k}" ${sel === k ? 'selected' : ''}>${o.label}</option>`).join('');
function contactForm(d) { if (!can('edit')) return toast('Solo lectura', 'err'); const m = modal({ title: 'Nuevo contacto', size: 'lg', body: `<div class="fgrid"><div class="fld"><label>Nombre *</label><input class="inp" id="fn"/></div><div class="fld"><label>Apellidos</label><input class="inp" id="ln"/></div><div class="fld"><label>Email</label><input class="inp" id="em" type="email"/></div><div class="fld"><label>Teléfono</label><input class="inp" id="ph"/></div><div class="fld"><label>Cargo</label><input class="inp" id="jt"/></div><div class="fld"><label>Empresa</label>${companySel('co', d.companyId)}</div><div class="fld"><label>…o nueva empresa</label><input class="inp" id="cn" placeholder="Se crea al guardar"/></div><div class="fld"><label>Origen</label><select class="inp" id="src">${opts(SOURCES, 'referral')}</select></div><div class="fld"><label>Ciclo de vida</label><select class="inp" id="lc">${opts(LIFECYCLE, 'lead')}</select></div><div class="fld"><label>Propietario</label>${userSel('ow', S.me)}</div><label class="chk full"><input type="checkbox" id="cs"/>Consentimiento de marketing (RGPD)</label><div id="dup" class="full"></div></div>`, footer: `<button class="btn primary" id="ok">Crear contacto</button>` }); const go_ = (force) => { const fn = m.querySelector('#fn').value.trim(); if (!fn) return toast('El nombre es obligatorio', 'err'); const data = { firstName: fn, lastName: m.querySelector('#ln').value, email: m.querySelector('#em').value, phone: m.querySelector('#ph').value, jobTitle: m.querySelector('#jt').value, companyId: m.querySelector('#co').value || null, companyName: m.querySelector('#cn').value.trim() || null, source: m.querySelector('#src').value, lifecycle: m.querySelector('#lc').value, owner: m.querySelector('#ow').value || null, consent: m.querySelector('#cs').checked }; const r = createContact(data, { force, returnDup: true }); if (r.dup) { m.querySelector('#dup').innerHTML = `<div class="card" style="background:#fff6e5"><b>Puede que ya exista:</b> <a href="#/contactos/${r.dup.id}">${esc(contactName(r.dup))}</a> (mismo email). <button class="btn sm outline" id="force">Crear de todos modos</button></div>`; m.querySelector('#force').onclick = () => go_(true); return; } m.close(); toast('Contacto creado', 'ok'); go(`#/contactos/${r.id}`); }; m.querySelector('#ok').onclick = () => go_(false); }
function companyForm(d) { if (!can('edit')) return toast('Solo lectura', 'err'); const m = modal({ title: 'Nueva empresa', body: `<div class="fgrid"><div class="fld full"><label>Nombre *</label><input class="inp" id="n"/></div><div class="fld"><label>Dominio</label><input class="inp" id="dm" placeholder="empresa.com"/></div><div class="fld"><label>Sector</label><input class="inp" id="se"/></div><div class="fld"><label>Tipo</label><select class="inp" id="ty">${opts(COMPANY_TYPE, 'prospect')}</select></div><div class="fld"><label>Empleados</label><input class="inp" id="sz" type="number"/></div><div class="fld"><label>Ciudad</label><input class="inp" id="ci"/></div><div class="fld"><label>Propietario</label>${userSel('ow', S.me)}</div></div>`, footer: `<button class="btn primary" id="ok">Crear empresa</button>` }); m.querySelector('#ok').onclick = () => { const n = m.querySelector('#n').value.trim(); if (!n) return toast('El nombre es obligatorio', 'err'); if (S.companies.some((c) => norm(c.name) === norm(n))) return toast('Ya existe una empresa con ese nombre', 'err'); const c = createCompany({ name: n, domain: m.querySelector('#dm').value, sector: m.querySelector('#se').value, type: m.querySelector('#ty').value, size: Number(m.querySelector('#sz').value) || null, city: m.querySelector('#ci').value, owner: m.querySelector('#ow').value || null }); m.close(); go(`#/empresas/${c.id}`); }; }
function dealForm(d) { if (!can('edit')) return toast('Solo lectura', 'err'); const m = modal({ title: 'Nuevo negocio', body: `<div class="fgrid"><div class="fld full"><label>Nombre *</label><input class="inp" id="n" value="${esc(d.name || '')}" placeholder="Empresa · Oportunidad"/></div><div class="fld"><label>Empresa</label>${companySel('co', d.companyId)}</div><div class="fld"><label>Contacto principal</label><select class="inp" id="ct"><option value="">—</option>${S.contacts.map((c) => `<option value="${c.id}" ${(d.contactIds || [])[0] === c.id ? 'selected' : ''}>${esc(contactName(c))}</option>`).join('')}</select></div><div class="fld"><label>Etapa</label><select class="inp" id="st">${S.pipeline.stages.map((s) => `<option value="${s.id}">${esc(s.name)} (${s.prob}%)</option>`).join('')}</select></div><div class="fld"><label>Importe</label><input class="inp" id="am" type="number" value="0"/></div><div class="fld"><label>Cierre previsto</label><input class="inp" id="cl" type="date" value="${dayISO(addDays(30))}" min="${dayISO()}"/></div><div class="fld"><label>Propietario</label>${userSel('ow', S.me)}</div><div class="fld"><label>Prioridad</label><select class="inp" id="pr">${opts(PRIORITY, 'normal')}</select></div></div>`, footer: `<button class="btn primary" id="ok">Crear negocio</button>` }); m.querySelector('#ok').onclick = () => { const n = m.querySelector('#n').value.trim(); if (!n) return toast('El nombre es obligatorio', 'err'); const close = m.querySelector('#cl').value; if (close < dayISO()) return toast('La fecha de cierre no puede ser anterior a hoy', 'err'); const dl = createDeal({ name: n, companyId: m.querySelector('#co').value || null, contactIds: m.querySelector('#ct').value ? [m.querySelector('#ct').value] : [], stageId: m.querySelector('#st').value, amount: Number(m.querySelector('#am').value), close, owner: m.querySelector('#ow').value || null, priority: m.querySelector('#pr').value }); m.close(); go(`#/negocios/${dl.id}`); }; }
function taskForm(d) { if (!can('edit')) return toast('Solo lectura', 'err'); const m = modal({ title: 'Nueva tarea', body: `<div class="fgrid"><div class="fld full"><label>Título *</label><input class="inp" id="t" value="${esc(d.title || '')}"/></div><div class="fld"><label>Tipo</label><select class="inp" id="ty">${opts(TASK_TYPE, 'followup')}</select></div><div class="fld"><label>Prioridad</label><select class="inp" id="pr">${opts(PRIORITY, 'normal')}</select></div><div class="fld"><label>Vence</label><input class="inp" id="du" type="date" value="${dayISO(addDays(1))}"/></div><div class="fld"><label>Asignada a</label>${userSel('as', S.me)}</div><div class="fld"><label>Repetir</label><select class="inp" id="re"><option value="">No</option><option value="daily">Cada día</option><option value="weekly">Cada semana</option><option value="monthly">Cada mes</option></select></div><div class="fld"><label>Negocio</label><select class="inp" id="dl"><option value="">—</option>${S.deals.filter((x) => x.status === 'open').map((x) => `<option value="${x.id}" ${d.dealId === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div><div class="fld full"><label>Contacto</label><select class="inp" id="ct"><option value="">—</option>${S.contacts.map((c) => `<option value="${c.id}" ${d.contactId === c.id ? 'selected' : ''}>${esc(contactName(c))}</option>`).join('')}</select></div></div>`, footer: `<button class="btn primary" id="ok">Crear tarea</button>` }); m.querySelector('#ok').onclick = () => { const t = m.querySelector('#t').value.trim(); if (!t) return toast('Indica el título', 'err'); createTask({ title: t, type: m.querySelector('#ty').value, priority: m.querySelector('#pr').value, due: m.querySelector('#du').value, assignee: m.querySelector('#as').value || null, recurrence: m.querySelector('#re').value || null, dealId: m.querySelector('#dl').value || d.dealId || null, contactId: m.querySelector('#ct').value || d.contactId || null, companyId: d.companyId || null, ticketId: d.ticketId || null }); m.close(); toast('Tarea creada', 'ok'); refresh(); if (PANEL) renderPanel(); }; }
function ticketForm(d) { if (!can('edit')) return toast('Solo lectura', 'err'); const m = modal({ title: 'Nuevo ticket', body: `<div class="fgrid"><div class="fld full"><label>Asunto *</label><input class="inp" id="s"/></div><div class="fld"><label>Contacto</label><select class="inp" id="ct"><option value="">—</option>${S.contacts.map((c) => `<option value="${c.id}">${esc(contactName(c))}</option>`).join('')}</select></div><div class="fld"><label>Prioridad</label><select class="inp" id="pr">${opts(PRIORITY, 'normal')}</select></div><div class="fld"><label>Canal</label><select class="inp" id="ch"><option>email</option><option>teléfono</option><option>formulario</option><option>chat</option><option>manual</option></select></div><div class="fld"><label>Categoría</label><input class="inp" id="ca" placeholder="Técnico, Facturación…"/></div><div class="fld"><label>Agente</label>${userSel('as', S.me)}</div><div class="fld full"><label>Descripción</label><textarea class="inp" id="de"></textarea></div></div>`, footer: `<button class="btn primary" id="ok">Crear ticket</button>` }); m.querySelector('#ok').onclick = () => { const s = m.querySelector('#s').value.trim(); if (!s) return toast('Indica el asunto', 'err'); const t = createTicket({ subject: s, contactId: m.querySelector('#ct').value || null, priority: m.querySelector('#pr').value, channel: m.querySelector('#ch').value, category: m.querySelector('#ca').value, assignee: m.querySelector('#as').value || null, description: m.querySelector('#de').value }); m.close(); go(`#/tickets/${t.id}`); }; }
</script>
<script>

PAGES.ajustes = () => {
  const tab = route.id || 'general'; const tabs = [['general', 'General'], ['usuarios', 'Usuarios y equipos'], ['roles', 'Roles y permisos'], ['pipeline', 'Pipeline y etapas'], ['campos', 'Campos personalizados'], ['plantillas', 'Plantillas de email'], ['scoring', 'Lead scoring'], ['auditoria', 'Auditoría'], ['papelera', 'Papelera'], ['importar', 'Importar CSV'], ['rgpd', 'RGPD'], ['datos', 'Datos y copia']];
  setHead({ title: 'Ajustes', desc: 'Configuración del CRM. Algunas secciones requieren rol de administrador.', toolbar: `<div class="stabs">${tabs.map(([k, l]) => `<button class="${tab === k ? 'active' : ''}" data-go="#/ajustes/${k}">${l}</button>`).join('')}</div>` });
  const adm = can('admin'); const lock = adm ? '' : '<div class="card mb12" style="background:#fff6e5">Solo un administrador puede modificar esta sección (puedes verla).</div>'; let h = '';
  const s = S.settings;

ra en la línea temporal y se simula la apertura a los pocos segundos (seguimiento de aperturas). En la versión servidor se configura SMTP y se sincronizan los buzones de Gmail / Microsoft 365.</p></div>`;

  if (tab === 'scoring') h = `${lock}<div class="card"><h3>Lead scoring</h3><p class="small muted mb8">Puntos por reglas sobre el contacto o su empresa (company.size…). Además: +3 por interacción entrante (máx. 30), +2 por email abierto (máx. 20), −10 por email gratuito, −1 por semana sin actividad. MQL ≥ ${s.mqlThreshold}, SQL ≥ ${s.sqlThreshold}.</p><table class="t"><thead><tr><th>Regla</th><th>Campo</th><th>Operador</th><th>Valor</th><th class="r">Puntos</th><th>Activa</th><th></th></tr></thead><tbody>${S.scoring.map((r) => `<tr><td>${esc(r.label)}</td><td><code>${esc(r.field)}</code></td><td>${r.op}</td><td>${esc(r.value ?? '')}</td><td class="r b">${r.points > 0 ? '+' : ''}${r.points}</td><td><input type="checkbox" ${r.on ? 'checked' : ''} data-act="score-toggle" data-arg="${r.id}" ${adm ? '' : 'disabled'}/></td><td class="r">${adm ? `<button class="ibtn" data-act="score-del" data-arg="${r.id}">${ico.trash}</button>` : ''}</td></tr>`).join('')}</tbody></table>${adm ? `<div class="row wrap mt12"><input class="inp" id="sl" placeholder="Descripción" style="width:180px"/><input class="inp" id="sf" placeholder="campo" value="jobTitle" style="width:130px"/><select class="inp" id="so" style="width:auto"><option>contains</option><option>eq</option><option>gt</option><option>lt</option><option>not_empty</option></select><input class="inp" id="sv" placeholder="valor" style="width:120px"/><input class="inp" id="sp" type="number" value="10" style="width:80px"/><button class="btn primary sm" data-act="score-add">Añadir</button><button class="btn sm outline" data-act="score-recalc">Recalcular todos</button></div>` : ''}</div>`;
  if (tab === 'auditoria') { const rows = S.audit.slice(0, 150); h = `<div class="card"><h3>Registro de auditoría</h3><p class="small muted mb8">Quién cambió qué y cuándo, con valores anterior y nuevo. Incluye creaciones, borrados, exportaciones, fusiones y anonimizaciones.</p><table class="t"><thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Objeto</th><th>Cambios</th></tr></thead><tbody>${rows.map((a) => `<tr><td class="small">${fdt(a.at)}</td><td class="small">${esc(user(a.user)?.name || 'sistema')}</td><td><span class="tag">${a.action}</span></td><td class="small">${a.rid ? `<a href="${linkOf(a.obj, a.rid)}">${esc(itemName(a.obj, a.rid))}</a>` : a.obj}</td><td class="small muted">${Object.entries(a.changes || {}).slice(0, 5).map(([k, v]) => `<b>${esc(k)}</b>: ${Array.isArray(v) ? `${esc(fmtv(v[0]))} → ${esc(fmtv(v[1]))}` : esc(fmtv(v))}`).join(' · ')}</td></tr>`).join('')}</tbody></table></div>`; }

  if (tab === 'importar') h = `<div class="card"><h3>Importar CSV</h3><p class="small muted mb12">Pega un CSV o elige un archivo (separador coma o punto y coma, con cabecera). Se detectan las columnas, se evitan duplicados por email y se crean las empresas por nombre. La importación se puede revertir.</p><div class="row wrap mb8"><select class="inp" id="io" style="width:auto"><option value="contacts">Contactos</option><option value="companies">Empresas</option><option value="deals">Negocios</option></select><label class="btn outline">${ico.up}Elegir archivo<input type="file" accept=".csv,text/csv" id="if" style="display:none"/></label></div><textarea class="inp" id="ic" style="min-height:140px;font-family:monospace;font-size:12px" placeholder="nombre;email;telefono;empresa;cargo\nAna Pérez;ana@acme.com;600112233;Acme SL;Directora de compras\nLuis Gómez;luis@beta.io;;Beta;CEO"></textarea><div class="row mt8"><button class="btn primary" data-act="import-run">Importar</button><button class="btn outline" data-act="import-sample">Cargar ejemplo</button></div></div><div class="card mt12"><h3>Historial</h3>${S.imports.map((i) => `<div class="rel"><span class="grow">${fdt(i.at)} · ${OBJ_LABEL[i.obj]}s · <b>${i.created}</b> creados, ${i.skipped} omitidos (duplicados), ${i.errors} con error</span>${i.reverted ? '<span class="tag">revertida</span>' : `<button class="btn sm outline" data-act="import-revert" data-arg="${i.id}">Revertir</button>`}</div>`).join('') || '<p class="muted small">Sin importaciones.</p>'}</div>`;

  if (tab === 'datos') h = `<div class="card"><h3>Datos y copia de seguridad</h3><p class="small muted">Esta demo guarda todo en el navegador (localStorage). Exporta una copia completa en JSON o restáurala. En la versión servidor la base de datos es un archivo SQLite con copia diaria.</p><div class="row wrap mt12"><button class="btn primary" data-act="backup">${ico.down}Exportar copia (JSON)</button><label class="btn outline">${ico.up}Restaurar copia<input type="file" accept=".json" id="rf" style="display:none"/></label><button class="btn danger" data-act="reset-demo">${ico.refresh}Restablecer datos de demostración</button></div><p class="small muted mt12">${S.contacts.length} contactos · ${S.companies.length} empresas · ${S.deals.length} negocios · ${S.tasks.length} tareas · ${S.tickets.length} tickets · ${S.activities.length} actividades · ${S.audit.length} entradas de auditoría</p></div>`;

ACT['user-new'] = () => { const m = modal({ title: 'Nuevo usuario', body: `<div class="fgrid"><div class="fld"><label>Nombre</label><input class="inp" id="n"/></div><div class="fld"><label>Email</label><input class="inp" id="e" type="email"/></div><div class="fld"><label>Rol</label><select class="inp" id="r">${Object.entries(ROLES).map(([k, r]) => `<option value="${k}">${r.label}</option>`).join('')}</select></div><div class="fld"><label>Equipo</label><select class="inp" id="t"><option value="">—</option>${S.teams.map((t) => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="fld"><label>Cuota mensual</label><input class="inp" id="q" type="number"/></div></div>`, footer: `<button class="btn primary" id="ok">Crear</button>` }); m.querySelector('#ok').onclick = () => { const n = m.querySelector('#n').value.trim(); if (!n) return; const u = { id: uid(), name: n, email: m.querySelector('#e').value, role: m.querySelector('#r').value, color: [C.blue, C.purple, C.green, C.orange, C.pink, C.teal][S.users.length % 6], active: true, quota: Number(m.querySelector('#q').value) || null }; S.users.push(u); const t = S.teams.find((x) => x.id === m.querySelector('#t').value); if (t) t.members.push(u.id); audit('users', u.id, 'create', { nombre: n }); m.close(); refresh(); }; };
ACT['user-toggle'] = (id) => { const u = user(id); u.active = !u.active; audit('users', id, 'update', { activo: u.active }); refresh(); };
ACT['switch-user'] = (id) => { S.me = id; SEL = { obj: null, ids: [] }; closePanel(); audit('users', id, 'login'); toast(`Sesión iniciada como ${user(id).name} (${ROLES[user(id).role].label})`, 'ok'); refresh(); };
document.getElementById('btnUser').onclick = (e) => { const box = dropdown(e.currentTarget, `<div class="xs muted" style="padding:4px 8px">Entrar como…</div>` + S.users.filter((u) => u.active).map((u) => `<button data-k="${u.id}">${avatarOf(u.id, 'sm')}<span>${esc(u.name)}<div class="xs muted">${ROLES[u.role].label}</div></span>${u.id === S.me ? ' ✓' : ''}</button>`).join(''), 'list'); box.querySelectorAll('[data-k]').forEach((b) => (b.onclick = () => { closeDd(); ACT['switch-user'](b.dataset.k); })); };
ACT['stage-add'] = () => { const n = prompt('Nombre de la etapa'); if (!n) return; S.pipeline.stages.push({ id: uid(), name: n, color: [C.teal, C.lime, C.pink, C.sky][S.pipeline.stages.length % 4], prob: 50, days: 14, required: [] }); refresh(); };
ACT['stage-move'] = ({ id, d }) => { const a = S.pipeline.stages; const i = a.findIndex((s) => s.id === id); const j = i + d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; refresh(); };
ACT['stage-del'] = async (id) => { if (S.deals.some((d) => d.stageId === id && d.status === 'open')) return toast('Hay negocios abiertos en esta etapa; muévelos antes', 'err'); if (S.pipeline.stages.length <= 2) return toast('El pipeline necesita al menos dos etapas', 'err'); if (await ask('¿Borrar la etapa?', '', 'Borrar', true)) { S.pipeline.stages = S.pipeline.stages.filter((s) => s.id !== id); refresh(); } };
ACT['col-del'] = ({ obj, key }) => { S.customCols[obj] = S.customCols[obj].filter((c) => c.key !== key); refresh(); };
ACT['tpl-new'] = () => tplForm(null); ACT['tpl-edit'] = (id) => tplForm(S.templates.find((t) => t.id === id)); ACT['tpl-del'] = (id) => { S.templates = S.templates.filter((t) => t.id !== id); refresh(); };
function tplForm(t) { const m = modal({ title: t ? 'Editar plantilla' : 'Nueva plantilla', body: `<div class="col"><div class="fld"><label>Nombre</label><input class="inp" id="n" value="${esc(t?.name || '')}"/></div><div class="fld"><label>Asunto</label><input class="inp" id="s" value="${esc(t?.subject || '')}"/></div><div class="fld"><label>Cuerpo</label><textarea class="inp" id="b" style="min-height:160px">${esc(t?.body || '')}</textarea></div></div>`, footer: `<button class="btn primary" id="ok">Guardar</button>` }); m.querySelector('#ok').onclick = () => { const d = { name: m.querySelector('#n').value, subject: m.querySelector('#s').value, body: m.querySelector('#b').value }; if (!d.name) return; if (t) Object.assign(t, d); else S.templates.push({ id: uid(), ...d }); m.close(); refresh(); }; }
ACT['score-toggle'] = (id, el) => { S.scoring.find((r) => r.id === id).on = el.checked; S.contacts.forEach(rescore); save(); };
ACT['score-del'] = (id) => { S.scoring = S.scoring.filter((r) => r.id !== id); S.contacts.forEach(rescore); refresh(); };

  const tt = ['Llamar para cerrar', 'Enviar propuesta revisada', 'Preparar demo', 'Confirmar reunión', 'Revisar contrato', 'Enviar referencias'];
  for (const d of deals.filter((x) => x.status === 'open')) if (rnd(10) < 7) S.tasks.push({ id: uid(), title: pickA(tt), type: pickA(['call', 'email', 'meeting', 'followup']), priority: pickA(['low', 'normal', 'high']), status: 'todo', due: dayISO(addDays(rnd(12) - 3)), assignee: d.owner, contactId: d.contactIds[0] || null, companyId: d.companyId, dealId: d.id, createdAt: ago(rnd(10)) });
  for (const u of owners) S.tasks.push({ id: uid(), title: 'Revisar pipeline semanal', type: 'todo', priority: 'normal', status: 'todo', due: dayISO(), assignee: u, recurrence: 'weekly', createdAt: ago(1) });
  S.tasks.push({ id: uid(), title: 'Preparar informe mensual de ventas', type: 'todo', priority: 'high', status: 'doing', due: dayISO(addDays(2)), assignee: 'u1', createdAt: ago(2) }, { id: uid(), title: 'Enviar referencias a Nortec', type: 'email', priority: 'normal', status: 'done', due: dayISO(), doneAt: nowISO(), outcome: 'Enviado', assignee: 'u2', createdAt: ago(2) });
  for (let i = 0; i < 6; i++) { const c = contacts[i * 5]; logActivity({ type: 'meeting', subject: pickA(subj.meeting), at: addDays(1 + rnd(6)).toISOString(), user: c.owner, contactId: c.id, companyId: c.companyId }); }
  const ts = ['No puedo exportar a Excel', 'Error al sincronizar calendario', 'Solicitud de nueva funcionalidad', 'Factura duplicada', 'Acceso bloqueado tras cambio de contraseña', 'Dudas sobre la renovación'];
  contacts.slice(0, 8).forEach((c, i) => { const t = createTicket({ subject: ts[i % 6], description: 'Descripción reportada por el cliente.', contactId: c.id, channel: pickA(['email', 'formulario', 'teléfono']), priority: pickA(['low', 'normal', 'high', 'urgent']), category: pickA(['Técnico', 'Facturación', 'Producto']), assignee: 'u5', createdAt: ago(rnd(15)) }); if (i < 3) { t.status = 'resolved'; t.resolvedAt = ago(rnd(5)); t.firstResponse = ago(rnd(5)); t.csat = 3 + rnd(3); } else if (i < 5) { t.status = 'open'; t.firstResponse = ago(1); } });
  const od = deals.find((d) => d.status === 'open' && d.amount > 5000); if (od) { S.counters.quote++; S.quotes.push({ id: uid(), dealId: od.id, number: `P-${new Date().getFullYear()}-0001`, version: 1, date: dayISO(addDays(-3)), validUntil: dayISO(addDays(27)), lines: [{ name: S.products[1].name, qty: 15, price: 59, discount: 0, tax: 21 }, { name: S.products[3].name, qty: 1, price: 600, discount: 0, tax: 21 }], discount: 5, subtotal: (15 * 59 + 600) * 0.95, tax: (15 * 59 + 600) * 0.95 * 0.21, total: (15 * 59 + 600) * 0.95 * 1.21, status: 'sent', notes: 'Validez 30 días. Pago a 30 días desde factura.', views: 0, createdBy: od.owner, createdAt: ago(3), sentAt: ago(3) }); }
  S.lists = [{ id: uid(), name: 'Leads calientes (MQL y SQL)', obj: 'contacts', kind: 'dynamic', rule: { field: 'lifecycle', op: 'contains', value: 'ql' }, ids: [], createdAt: ago(10) }, { id: uid(), name: 'Clientes', obj: 'companies', kind: 'dynamic', rule: { field: 'type', op: 'eq', value: 'customer' }, ids: [], createdAt: ago(10) }, { id: uid(), name: 'Newsletter trimestral', obj: 'contacts', kind: 'static', rule: {}, ids: contacts.filter((c) => c.consent).slice(0, 12).map((c) => c.id), createdAt: ago(10) }];
  S.contacts.forEach(rescore); S.notifs = []; S.audit = S.audit.slice(0, 80); S.autolog = []; S.automations.forEach((a) => (a.runs = 0));
  notify('u6', 'Bienvenido a la demo del CRM', 'Explora el pipeline, edita celdas, prueba las automatizaciones y cambia de usuario para ver los permisos.', '#/negocios');
  save();
}

S.ui = S.ui || { view: {}, b: {} }; S.ui.b = S.ui.b || {}; S.ui.view = S.ui.view || {};
dailyChecks(); setInterval(dailyChecks, 60000);
if (!location.hash) location.hash = '#/inicio';
render();
