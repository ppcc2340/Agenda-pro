<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tutorial · CRM · demo funcional</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#f6f7fb;--ink:#323338;--ink2:#676879;--ink3:#9699a6;--line:#d0d4e4;--line2:#e6e9ef;--hover:#f5f6f8;--primary:#0073ea;--primary-h:#0060b9;--primary-s:#e6f1fd;
 --c-blue:#579bfc;--c-purple:#a25ddc;--c-green:#00c875;--c-red:#e2445c;--c-orange:#fdab3d;--c-dark:#323338;--c-teal:#66ccff;--c-grey:#c4c4c4;--c-indigo:#5559df;--c-violet:#784bd1;--c-lime:#9cd326;--c-pink:#ff158a;--c-brown:#7f5347;--c-sun:#ffcb00;--c-berry:#7e3b8a;--c-sky:#4eccc6;
 --shadow:0 6px 20px rgba(0,0,0,.12);--radius:8px}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:"Figtree",Roboto,"Segoe UI",system-ui,sans-serif;font-size:14px;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--primary);text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3{margin:0;font-weight:500}.muted{color:var(--ink2)}.small{font-size:12.5px}.xs{font-size:11.5px}.b{font-weight:600}.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:8px}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.right{margin-left:auto}.col{display:flex;flex-direction:column;gap:8px}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}
.app{display:grid;grid-template-rows:48px 1fr;height:100vh}
.topbar{display:flex;align-items:center;gap:10px;padding:0 14px;background:#fff;border-bottom:1px solid var(--line2)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;margin-right:10px;cursor:pointer}.logo .dots{display:flex;gap:3px}.logo .dots i{width:9px;height:9px;border-radius:50%;display:block}
.logo .dots i:nth-child(1){background:#ff3d57}.logo .dots i:nth-child(2){background:#ffcb00}.logo .dots i:nth-child(3){background:#00ca72}.logo small{font-weight:400;color:var(--ink2);font-size:13px}
.tb-search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:4px;padding:5px 10px;width:340px;color:var(--ink2);background:#fff;cursor:text;white-space:nowrap}.tb-search span{overflow:hidden;text-overflow:ellipsis}.tb-search kbd{margin-left:auto;white-space:nowrap;font:11px inherit;border:1px solid var(--line);border-radius:3px;padding:0 4px}
.tb-icons{margin-left:auto;display:flex;gap:4px;align-items:center}
.ibtn{width:32px;height:32px;border:0;background:transparent;border-radius:4px;display:grid;place-items:center;color:var(--ink2);position:relative}.ibtn:hover{background:var(--hover)}.ibtn svg{width:18px;height:18px}
.ibtn .badge{position:absolute;top:3px;right:2px;background:var(--c-red);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none;cursor:default}.avatar.sm{width:24px;height:24px;font-size:9.5px}
.body{display:grid;grid-template-columns:240px 1fr;min-height:0}
.side{background:#fff;border-right:1px solid var(--line2);padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.side a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:4px;color:var(--ink);text-decoration:none;font-weight:500}.side a:hover{background:var(--hover);text-decoration:none}.side a.active{background:var(--primary-s);color:var(--primary)}
.side a svg{width:18px;height:18px;color:var(--ink2);flex:none}.side a.active svg{color:var(--primary)}.side a .cnt{margin-left:auto;font-size:11px;color:var(--ink3)}
.side .sec{font-size:12px;color:var(--ink2);padding:14px 10px 4px;font-weight:600}
.ws{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;margin:4px 2px}.ws .wsi{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,#ff642e,#a25ddc);color:#fff;font-weight:700;display:grid;place-items:center;font-size:12px}
.side a.board{padding-left:14px}.side a.board i{width:16px;height:16px;border-radius:3px;display:inline-block;flex:none}
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.head{padding:14px 28px 0;background:#fff;border-bottom:1px solid var(--line2)}.head h1{font-size:24px;display:flex;align-items:center;gap:8px}.head p{margin:4px 0 10px;color:var(--ink2);font-size:13px}
.views{display:flex;gap:2px;align-items:center;overflow-x:auto}.views button{border:0;background:transparent;padding:8px 10px;border-bottom:2px solid transparent;color:var(--ink2);font-weight:500;display:flex;gap:6px;align-items:center;margin-bottom:-1px;white-space:nowrap}.views button.active{color:var(--ink);border-bottom-color:var(--primary)}.views button:hover{background:var(--hover)}
.toolbar{display:flex;align-items:center;gap:4px;padding:10px 28px;background:#fff;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:6px 10px;border-radius:4px;font-weight:500;color:var(--ink);white-space:nowrap}.btn:hover{background:var(--hover)}.btn svg{width:16px;height:16px;color:var(--ink2)}
.btn.primary{background:var(--primary);color:#fff;padding:7px 14px}.btn.primary:hover{background:var(--primary-h)}.btn.primary svg{color:#fff}.btn.outline{border:1px solid var(--line)}.btn.danger{color:var(--c-red)}.btn.sm{padding:4px 8px;font-size:13px}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.on{background:var(--primary-s);color:var(--primary)}
.tsearch{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:4px;border:1px solid transparent}.tsearch:focus-within{border-color:var(--primary);background:#fff}.tsearch input{border:0;outline:0;width:150px;background:transparent}.tsearch svg{width:16px;height:16px;color:var(--ink2)}
.content{flex:1;overflow:auto;padding:8px 28px 60px}
.inp{border:1px solid var(--line);border-radius:4px;padding:6px 9px;background:#fff;width:100%;min-height:34px}.inp:focus{outline:0;border-color:var(--primary)}select.inp{cursor:pointer}textarea.inp{min-height:70px;resize:vertical}
.fld{display:flex;flex-direction:column;gap:4px}.fld label{font-size:12.5px;font-weight:600;color:var(--ink2)}.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}.fgrid .full{grid-column:1/-1}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer}.chk input{accent-color:var(--primary);width:15px;height:15px}
/* board */
.group{margin:16px 0 24px}.ghead{display:flex;align-items:center;gap:8px;margin-bottom:6px}.ghead .caret{width:22px;height:22px;border:0;background:transparent;border-radius:4px;display:grid;place-items:center;color:var(--gc);transition:transform .15s}.ghead .caret svg{width:16px;height:16px}
.group.collapsed .caret{transform:rotate(-90deg)}.ghead h2{font-size:18px;color:var(--gc);cursor:text}.ghead .count{color:var(--ink2);font-size:13px}.group.collapsed .tbl,.group.collapsed .sumrow{display:none}
.tblwrap{overflow-x:auto}.tbl{display:grid;align-items:stretch;background:#fff;border-radius:4px 4px 0 0;min-width:max-content}
.tbl .cell{border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);min-height:36px;display:flex;align-items:center;padding:0 8px;font-size:13.5px;position:relative;background:#fff;min-width:0}
.tbl .cell.last{border-right:0}.tbl .gbar{background:var(--gc);border:0;padding:0;min-width:6px}.tbl .hd{color:var(--ink2);font-size:13px;justify-content:center;cursor:pointer;user-select:none}.tbl .hd.l{justify-content:flex-start}.tbl .hd:hover{background:var(--hover)}
.tbl .cb{justify-content:center}.tbl .cb input{width:15px;height:15px;accent-color:var(--primary);cursor:pointer}
.r:hover .cell:not(.gbar){background:var(--hover)}.r.sel .cell:not(.gbar){background:var(--primary-s)}
.cell.name{cursor:pointer;gap:6px}.cell.name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.cell.name:hover .nm{color:var(--primary)}.cell.name .chat{color:var(--ink3);display:flex;align-items:center;gap:3px;font-size:12px;opacity:0}.r:hover .chat,.chat.has{opacity:1}.chat.has{color:var(--primary)}.chat svg{width:16px;height:16px}
.cell.person{justify-content:center;white-space:nowrap;cursor:pointer}.cell.person .avatar{width:28px;height:28px}.cell.person .avatar+.avatar{margin-left:-8px;outline:2px solid #fff}.cell.person .none{width:28px;height:28px;border:1px dashed var(--line);border-radius:50%;display:grid;place-items:center;color:var(--ink3);font-size:16px}
.cell.status{padding:0;cursor:pointer}.pill{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:500;font-size:13px;min-height:36px;position:relative;text-align:center;line-height:1.1;padding:0 4px}.pill:hover{filter:brightness(1.07)}
.pill::after{content:"";position:absolute;right:0;top:0;width:0;border-left:9px solid transparent;border-top:9px solid rgba(255,255,255,.45);display:none}.cell.status:hover .pill::after{display:block}
.cell.num{justify-content:flex-end;font-variant-numeric:tabular-nums}.cell.date{justify-content:center;gap:5px;white-space:nowrap;cursor:pointer}.date .dot{width:7px;height:7px;border-radius:50%;background:var(--c-green);flex:none}.date .dot.late{background:var(--c-red)}.date .dot.soon{background:var(--c-orange)}
.cell.edit{cursor:text}.cell input.ce,.cell select.ce{position:absolute;inset:0;width:100%;height:100%;border:2px solid var(--primary);padding:0 8px;background:#fff;outline:0;z-index:2}
.cell.tl{padding:0 10px}.tlbar{width:100%;height:22px;border-radius:12px;background:var(--line2);position:relative;overflow:hidden;font-size:11px;color:#fff}.tlbar span{position:absolute;top:0;bottom:0;background:var(--gc);display:flex;align-items:center;justify-content:center;min-width:28px;border-radius:12px;white-space:nowrap;overflow:hidden;padding:0 8px}.tlbar span.short{color:transparent}
.cell.tags{gap:4px;flex-wrap:wrap;padding:4px 8px;cursor:pointer}.tag{background:var(--primary-s);color:var(--primary);border-radius:4px;padding:1px 7px;font-size:12px;white-space:nowrap}
.cell.link a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cell.bool{justify-content:center}.cell.bool input{accent-color:var(--primary);width:16px;height:16px;cursor:pointer}
.cell.prog{gap:8px}.prog .bar{flex:1;height:8px;background:var(--line2);border-radius:4px;overflow:hidden}.prog .bar i{display:block;height:100%;background:var(--c-green)}
.addrow .cell{color:var(--ink2);min-height:34px}.addrow input{border:0;outline:0;background:transparent;width:100%;padding:0}.addrow input::placeholder{color:var(--ink2)}
.sumrow{display:grid;background:#fff;border-radius:0 0 4px 4px;min-width:max-content}.sumrow .cell{min-height:34px;border-right:1px solid var(--line2);display:flex;align-items:center;justify-content:center;padding:0 8px;font-size:12px;color:var(--ink2);border-bottom:0}
.dist{display:flex;width:100%;height:22px;border-radius:4px;overflow:hidden}.dist i{display:block;height:100%}.sum{flex-direction:column;line-height:1.1;align-items:flex-end!important}.sum b{font-size:14px;color:var(--ink);font-weight:600}
.menu-dot{width:26px;height:26px;border:0;background:transparent;border-radius:4px;color:var(--ink3);display:grid;place-items:center;opacity:0}.r:hover .menu-dot{opacity:1}.menu-dot:hover{background:var(--line2);color:var(--ink)}
/* dropdown */
.dd{position:fixed;background:#fff;border-radius:8px;box-shadow:var(--shadow);padding:10px;z-index:80;width:230px;display:grid;grid-template-columns:1fr 1fr;gap:7px;max-height:70vh;overflow:auto}
.dd button{border:0;color:#fff;border-radius:4px;height:34px;font-weight:500;padding:0 6px;line-height:1.1}.dd button:hover{filter:brightness(1.08)}
.dd.list{grid-template-columns:1fr;width:250px;gap:2px}.dd.list button{background:transparent;color:var(--ink);display:flex;align-items:center;gap:10px;justify-content:flex-start;padding:4px 8px;text-align:left;height:auto;min-height:32px}.dd.list button:hover{background:var(--hover);filter:none}.dd.list button.danger{color:var(--c-red)}.dd .sep{grid-column:1/-1;height:1px;background:var(--line2);margin:3px 0}
.dd input.inp{grid-column:1/-1}
/* kanban */
.kanban{display:flex;gap:14px;padding:10px 0;align-items:flex-start;overflow-x:auto;min-height:60vh}.kcol{width:270px;flex:none;background:#eceff8;border-radius:8px;padding:8px}.kcol h3{color:#fff;border-radius:4px;padding:10px 12px;font-weight:500;font-size:15px;display:flex;justify-content:space-between;margin-bottom:8px}
.kcard{background:#fff;border-radius:8px;padding:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:grab}.kcard.drag{opacity:.4}.kcol.over{outline:2px dashed var(--primary);outline-offset:-4px}.kcard .t{font-weight:500;margin-bottom:6px}.kcard .m{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);flex-wrap:wrap}.kcard .m .avatar{margin-left:auto}.kcard .grp{font-size:11px;color:var(--gc);font-weight:600}
.kcard.stale{border-left:3px solid var(--c-orange)}
/* charts */
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:10px 0}.chart{background:#fff;border-radius:8px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.06)}.chart h3{margin:0 0 14px;font-size:16px}.chart.full{grid-column:1/-1}
.bars{display:flex;align-items:flex-end;gap:14px;height:200px;padding:0 6px;border-bottom:1px solid var(--line)}.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;min-width:0}.bar i{display:block;width:100%;border-radius:4px 4px 0 0;max-width:64px;transition:height .4s}.bar b{font-weight:600;font-size:12.5px;white-space:nowrap}.bar small{color:var(--ink2);text-align:center;font-size:11px;line-height:1.2}
.donut{display:flex;align-items:center;gap:22px}.ring{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;flex:none}.ring div{width:104px;height:104px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:600;font-size:18px;text-align:center;line-height:1.1}.ring div small{display:block;font-weight:400;color:var(--ink2);font-size:12px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px}.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:8px;vertical-align:-1px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:10px 0}.kpi{background:#fff;border-radius:8px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}.kpi .l{font-size:12.5px;color:var(--ink2);font-weight:500}.kpi .v{font-size:26px;font-weight:600;margin-top:2px}.kpi .s{font-size:12px;color:var(--ink2)}
.funnel{display:flex;flex-direction:column;gap:6px}.funnel .fr{display:flex;align-items:center;gap:10px}.funnel .fr span{width:130px;font-size:13px}.funnel .fr div{flex:1;height:22px;background:var(--line2);border-radius:4px;overflow:hidden}.funnel .fr div i{display:block;height:100%}.funnel .fr b{width:80px;text-align:right}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}.t th{text-align:left;font-size:12px;color:var(--ink2);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}.t td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:middle}.t tr:hover td{background:var(--hover)}.t td.r,.t th.r{text-align:right}
/* panel */
.panel{position:fixed;top:48px;right:0;bottom:0;width:620px;max-width:100vw;background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .2s;z-index:40;display:flex;flex-direction:column}.panel.open{transform:none}
.panel .ph{padding:16px 22px 0;border-bottom:1px solid var(--line2)}.panel h2{font-size:21px;display:flex;align-items:center;gap:8px;margin-bottom:8px}.panel h2 .ttl{flex:1;outline:0;border-radius:4px;padding:2px 4px}.panel h2 .ttl:focus{background:var(--hover)}
.ptabs{display:flex;gap:2px;overflow-x:auto}.ptabs button{border:0;background:transparent;padding:8px 10px;border-bottom:2px solid transparent;color:var(--ink2);font-weight:500;margin-bottom:-1px;white-space:nowrap}.ptabs button.active{color:var(--ink);border-bottom-color:var(--primary)}
.panel .pb{padding:14px 22px;overflow:auto;flex:1}.pacts{display:flex;gap:6px;flex-wrap:wrap;padding:10px 22px;border-top:1px solid var(--line2);background:#fafbfc}
.upd{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:14px}.upd textarea{width:100%;border:0;outline:0;resize:none;min-height:56px}.upd .ub{display:flex;justify-content:flex-end;gap:6px;align-items:center}
.post{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}.post .who{font-weight:600}.post .when{color:var(--ink2);font-size:12px;margin-left:6px}.post p{margin:3px 0 0;white-space:pre-wrap}.post .ic{width:30px;height:30px;border-radius:50%;background:var(--primary-s);color:var(--primary);display:grid;place-items:center;flex:none}.post .ic svg{width:15px;height:15px}.post.sys{opacity:.75}.post.sys .ic{background:var(--line2);color:var(--ink2)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:9px 12px;font-size:13.5px;align-items:center}.kv dt{color:var(--ink2)}.kv dd{margin:0;min-width:0}.kv dd .pill{display:inline-flex;min-height:26px;padding:0 10px;border-radius:4px;width:auto;cursor:pointer}.kv dd .edit{cursor:text;border-radius:4px;padding:2px 4px;margin:-2px -4px;display:inline-block;min-width:60px}.kv dd .edit:hover{background:var(--hover)}
.steps{display:flex;gap:3px;margin:8px 0 4px}.steps button{flex:1;height:28px;border:0;background:var(--line2);color:var(--ink2);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}.steps button:first-child{border-radius:6px 0 0 6px}.steps button:last-child{border-radius:0 6px 6px 0}.steps button.done{background:var(--sc);color:#fff}.steps button.cur{background:var(--sc);color:#fff;outline:2px solid var(--ink);outline-offset:-2px}
.rel{padding:8px 0;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}.rel .pill{display:inline-flex;min-height:22px;padding:0 8px;border-radius:4px;width:auto;font-size:11.5px}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(41,47,76,.5);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}.modal{background:#fff;border-radius:12px;width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}.modal.lg{max-width:900px}.modal.xl{max-width:1100px}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:16px 22px 8px}.modal .mh h2{font-size:20px}.modal .mb{padding:8px 22px 16px;overflow:auto}.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 22px 16px;border-top:1px solid var(--line2)}
/* notifications / palette */
.pop{position:fixed;top:46px;right:14px;width:380px;max-width:95vw;background:#fff;border-radius:10px;box-shadow:var(--shadow);z-index:60;max-height:70vh;display:flex;flex-direction:column}.pop .list{overflow:auto}.notif{display:block;padding:10px 14px;border-bottom:1px solid var(--line2);color:inherit;cursor:pointer}.notif:hover{background:var(--hover);text-decoration:none}.notif.unread{background:var(--primary-s)}.notif .t{font-weight:600;font-size:13px}.notif .bd{font-size:12.5px;color:var(--ink2)}
.palette{background:#fff;border-radius:12px;width:100%;max-width:640px;box-shadow:var(--shadow);overflow:hidden;align-self:flex-start;margin-top:8vh}.palette input{width:100%;border:0;padding:16px 18px;font-size:16px;outline:0;border-bottom:1px solid var(--line)}.palette .res{max-height:60vh;overflow:auto;padding:6px}.palette .g{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);padding:8px 10px 4px;font-weight:700}.palette .it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer}.palette .it:hover,.palette .it.act{background:var(--hover)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#323338;color:#fff;padding:10px 16px;border-radius:6px;box-shadow:var(--shadow);font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;z-index:90;max-width:90vw}.toast.show{opacity:1}.toast.ok{background:var(--c-green)}.toast.err{background:var(--c-red)}
.card{background:#fff;border-radius:8px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.06)}.card h3{font-size:16px;margin-bottom:10px}

.auto.off{opacity:.6}

<body>
<div class="app">
  <header class="topbar">

    <div class="tb-search" id="openPalette"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Buscar contactos, empresas, negocios…</span><kbd>Ctrl K</kbd></div>

      <button class="ibtn" data-go="#/ajustes/usuarios" title="Usuarios"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg></button>
      <button class="ibtn" id="btnUser" title="Cambiar de usuario (simula el inicio de sesión)" style="width:auto;padding:0 6px;gap:6px;display:flex"><span class="avatar" id="meAvatar">?</span><span id="meName" class="small" style="color:var(--ink)"></span></button>
    </div>

</div>

<button id="tutBtn" title="Abrir el tutorial"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Tutorial<span class="pct" id="tutPct">0%</span></button>
<div id="tut"></div>
<div id="tutTip"></div>
<script>
/* ============================================================
   CRM demo funcional · núcleo: datos, persistencia, permisos,
   auditoría, notificaciones, automatizaciones, enrutado y UI base
   ============================================================ */
'use strict';
const KEY = 'crm-tutorial-v1';
const C = { blue: '#579bfc', purple: '#a25ddc', green: '#00c875', red: '#e2445c', orange: '#fdab3d', dark: '#323338', teal: '#66ccff', grey: '#c4c4c4', indigo: '#5559df', violet: '#784bd1', lime: '#9cd326', pink: '#ff158a', brown: '#7f5347', sun: '#ffcb00', berry: '#7e3b8a', sky: '#4eccc6' };
const LIFECYCLE = { subscriber: { label: 'Suscriptor', color: C.grey }, lead: { label: 'Lead', color: C.blue }, mql: { label: 'MQL', color: C.teal }, sql: { label: 'SQL', color: C.indigo }, opportunity: { label: 'Oportunidad', color: C.purple }, customer: { label: 'Cliente', color: C.green }, evangelist: { label: 'Evangelista', color: C.lime }, lost: { label: 'Perdido', color: C.red } };
const LEAD_STATUS = { new: { label: 'Nuevo', color: C.blue }, contacted: { label: 'Contactado', color: C.orange }, qualified: { label: 'Cualificado', color: C.green }, unqualified: { label: 'No cualificado', color: C.red }, nurturing: { label: 'En nutrición', color: C.violet } };
const SOURCES = { web: { label: 'Web', color: C.blue }, referral: { label: 'Referido', color: C.green }, event: { label: 'Evento', color: C.purple }, outbound: { label: 'Outbound', color: C.orange }, ads: { label: 'Anuncios', color: C.pink }, import: { label: 'Importación', color: C.grey }, api: { label: 'API', color: C.dark } };
const COMPANY_TYPE = { prospect: { label: 'Prospecto', color: C.blue }, customer: { label: 'Cliente', color: C.green }, partner: { label: 'Partner', color: C.purple }, supplier: { label: 'Proveedor', color: C.orange }, competitor: { label: 'Competidor', color: C.red } };
const PRIORITY = { low: { label: 'Baja', color: C.blue }, normal: { label: 'Media', color: C.indigo }, high: { label: 'Alta', color: C.violet }, urgent: { label: 'Crítica', color: C.dark } };
const TASK_TYPE = { call: { label: 'Llamada', color: C.green }, email: { label: 'Email', color: C.blue }, meeting: { label: 'Reunión', color: C.orange }, followup: { label: 'Seguimiento', color: C.purple }, todo: { label: 'Tarea', color: C.grey } };
const TASK_STATUS = { todo: { label: 'Pendiente', color: C.grey }, doing: { label: 'En curso', color: C.orange }, done: { label: 'Hecha', color: C.green } };
const TICKET_STATUS = { new: { label: 'Nuevo', color: C.blue }, open: { label: 'Abierto', color: C.orange }, pending: { label: 'Esperando cliente', color: C.violet }, resolved: { label: 'Resuelto', color: C.green }, closed: { label: 'Cerrado', color: C.grey } };
const DEAL_STATUS = { open: { label: 'Abierto', color: C.blue }, won: { label: 'Ganado', color: C.green }, lost: { label: 'Perdido', color: C.red } };
const QUOTE_STATUS = { draft: { label: 'Borrador', color: C.grey }, sent: { label: 'Enviado', color: C.blue }, viewed: { label: 'Visto', color: C.teal }, accepted: { label: 'Aceptado', color: C.green }, rejected: { label: 'Rechazado', color: C.red }, expired: { label: 'Caducado', color: C.orange } };
const PERIOD = { one_time: { label: 'Único', color: C.grey }, monthly: { label: 'Mensual', color: C.blue }, yearly: { label: 'Anual', color: C.purple } };
const LOSS = { price: 'Precio', competitor: 'Competidor', no_budget: 'Sin presupuesto', no_response: 'Sin respuesta', timing: 'Timing', no_need: 'Sin necesidad' };
const ROLES = { admin: { label: 'Administrador', vis: 'all', edit: true, admin: true }, manager: { label: 'Manager', vis: 'team', edit: true, admin: false }, sales: { label: 'Comercial', vis: 'own', edit: true, admin: false }, support: { label: 'Soporte', vis: 'all', edit: true, admin: false }, readonly: { label: 'Solo lectura', vis: 'all', edit: false, admin: false } };

const uid = () => Math.random().toString(36).slice(2, 10);
const nowISO = () => new Date().toISOString();
const dayISO = (dt = new Date()) => { const z = new Date(dt); z.setMinutes(z.getMinutes() - z.getTimezoneOffset()); return z.toISOString().slice(0, 10); };
const addDays = (n, from = new Date()) => { const z = new Date(from); z.setDate(z.getDate() + n); return z; };
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n, cur) => new Intl.NumberFormat('es-ES', { style: 'currency', currency: cur || S.settings.currency || 'EUR', maximumFractionDigits: 0 }).format(Number(n) || 0);
const money2 = (n) => new Intl.NumberFormat('es-ES', { style: 'currency', currency: S.settings.currency || 'EUR' }).format(Number(n) || 0);
const fdate = (s, o = { day: 'numeric', month: 'short' }) => (s ? new Date(s.length === 10 ? s + 'T00:00:00' : s).toLocaleDateString('es-ES', o) : '');
const fdt = (s) => (s ? new Date(s).toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '');
const rel = (s) => { if (!s) return ''; const m = Math.round((Date.now() - new Date(s)) / 6e4); if (m < 1) return 'ahora'; if (m < 60) return `hace ${m} min`; const h = Math.round(m / 60); if (h < 24) return `hace ${h} h`; const d = Math.round(h / 24); if (d < 30) return `hace ${d} d`; const mo = Math.round(d / 30); return mo < 12 ? `hace ${mo} ${mo === 1 ? 'mes' : 'meses'}` : `hace ${Math.round(d / 365)} años`; };
const initials = (n) => String(n || '?').split(/\s+/).slice(0, 2).map((x) => x[0]?.toUpperCase() ?? '').join('');
const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;
const sumBy = (arr, f) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

/* ---------- estado ---------- */
let S = null;
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* sin espacio */ } }
function load() { try { const j = localStorage.getItem(KEY); if (j) { S = JSON.parse(j); if (S.version === 1) return true; } } catch (e) { /* ignore */ } return false; }
const T = { contacts: 'contacts', companies: 'companies', deals: 'deals', tasks: 'tasks', tickets: 'tickets', products: 'products', quotes: 'quotes' };
const byId = (coll, id) => (S[coll] || []).find((x) => x.id === id);
const user = (id) => S.users.find((u) => u.id === id);
const me = () => user(S.me);
const myRole = () => ROLES[me().role];

  if (obj === 'contacts' && key === 'lifecycle') sysNote(`Ciclo de vida: ${LIFECYCLE[from]?.label} → ${LIFECYCLE[value]?.label}`, { contactId: item.id });
  if ((key === 'owner' || key === 'assignee') && value && value !== S.me) notify(value, `Se te ha asignado: ${item.name || item.title || item.subject || item.firstName + ' ' + item.lastName}`, `Por ${me().name}`, linkOf(obj, item.id));
  if (obj === 'contacts') rescore(item);

/* comprobaciones diarias (al cargar y cada minuto): tareas vencidas, negocios inactivos/estancados, SLA, presupuestos caducados */
function dailyChecks() {
  const today = dayISO();
  for (const t of S.tasks) if (t.status !== 'done' && t.due && t.due < today && !t.overdueNotified) { t.overdueNotified = true; notify(t.assignee, `Tarea vencida: ${t.title}`, '', '#/tareas', 'warn'); emit('overdue', 'tasks', t); }
  for (const d of S.deals.filter((x) => x.status === 'open')) {
    const days = daysBetween(d.lastActivity || d.createdAt, nowISO());
    if (days >= S.settings.inactiveDays && d.inactiveCheck !== today) { d.inactiveCheck = today; emit('inactive', 'deals', d, { days }); }
    const st = stage(d.stageId); const inStage = daysBetween(d.stageAt, nowISO());
    if (st && inStage > st.days && d.staleCheck !== today) { d.staleCheck = today; emit('stale', 'deals', d, { days: inStage }); }
  }
  for (const t of S.tickets) if (['new', 'open'].includes(t.status) && !t.firstResponse && t.slaDue < nowISO() && !t.slaNotified) { t.slaNotified = true; notify(t.assignee, `SLA incumplido: ticket #${t.number}`, t.subject, `#/tickets/${t.id}`, 'warn'); }
  for (const q of S.quotes) if (['sent', 'viewed'].includes(q.status) && q.validUntil < today) q.status = 'expired';
  for (const c of S.contacts) if (c.leadStatus === 'new' && !c.firstResponse && daysBetween(c.createdAt, nowISO()) * 24 >= S.settings.leadSlaHours && !c.slaNotified) { c.slaNotified = true; notify(c.owner, `Lead sin contactar: ${c.firstName} ${c.lastName}`, `Más de ${S.settings.leadSlaHours} h sin primer contacto`, `#/contactos/${c.id}`, 'warn'); }
  save();
}

ACT['deal-close'] = ({ id, status }) => { const d = byId('deals', id); if (!can('edit')) return toast('Solo lectura', 'err'); const m = modal({ title: status === 'won' ? `Marcar como ganado: ${esc(d.name)}` : `Marcar como perdido: ${esc(d.name)}`, body: status === 'won' ? `<p class="muted small">Los contactos pasan a «Cliente», la empresa a tipo cliente y se disparan las automatizaciones de onboarding.</p><div class="fld mt12"><label>Nota</label><textarea class="inp" id="n"></textarea></div>` : `<div class="fgrid"><div class="fld"><label>Motivo de pérdida *</label><select class="inp" id="r">${Object.entries(LOSS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div><div class="fld"><label>Competidor</label><input class="inp" id="c"/></div><div class="fld full"><label>Nota</label><textarea class="inp" id="n"></textarea></div></div>`, footer: `<button class="btn primary" id="ok" style="${status === 'lost' ? 'background:var(--c-red)' : ''}">${status === 'won' ? 'Confirmar ganado' : 'Confirmar perdido'}</button>` }); m.querySelector('#ok').onclick = () => { closeDeal(d, status, status === 'lost' ? m.querySelector('#r').value : null, m.querySelector('#c')?.value, m.querySelector('#n').value); m.close(); toast(status === 'won' ? '¡Negocio ganado! 🎉' : 'Negocio marcado como perdido', status === 'won' ? 'ok' : ''); refresh(); if (PANEL) renderPanel(); }; };
ACT['deal-reopen'] = ({ id }) => { const d = byId('deals', id); d.status = 'open'; d.closedAt = null; d.lossReason = null; d.prob = stage(d.stageId)?.prob ?? 10; audit('deals', d.id, 'update', { estado: ['cerrado', 'open'] }); sysNote('Negocio reabierto', { dealId: d.id }); refresh(); renderPanel(); };
ACT['line-add'] = (id) => { const d = byId('deals', id); const pid = document.getElementById('lineProd').value; const p = byId('products', pid); if (!p) return; d.products.push({ productId: p.id, name: p.name, qty: 1, price: p.price, discount: 0, period: p.period }); recalcDeal(d); refresh(); renderPanel(); };
ACT['line-del'] = ({ id, i }) => { const d = byId('deals', id); d.products.splice(i, 1); recalcDeal(d); refresh(); renderPanel(); };
function recalcDeal(d) { if (d.products.length) { const from = d.amount; d.amount = Math.round(sumBy(d.products, (l) => l.qty * l.price * (1 - l.discount / 100)) * 100) / 100; audit('deals', d.id, 'update', { importe: [from, d.amount], lineas: d.products.length }); } }
</script>

  tickets: () => [{ key: 'subject', label: 'Ticket', type: 'name', get: (t) => `#${t.number} · ${t.subject}` }, { key: 'status', label: 'Estado', type: 'status', opt: TICKET_STATUS, w: 130 }, { key: 'priority', label: 'Prioridad', type: 'status', opt: PRIORITY, w: 100 }, { key: 'contact', label: 'Contacto', type: 'rel', w: 150, get: (t) => { const c = byId('contacts', t.contactId); return c ? { label: contactName(c), href: `#/contactos/${c.id}` } : { label: '—' }; } }, personCol('assignee', 'Agente'), { key: 'category', label: 'Categoría', type: 'text', w: 110 }, { key: 'sla', label: 'SLA', type: 'calc', w: 120, get: (t) => (['resolved', 'closed'].includes(t.status) ? '<span class="muted">—</span>' : t.firstResponse ? '<span style="color:var(--c-green)">respondido</span>' : `<span style="color:${t.slaDue < nowISO() ? 'var(--c-red)' : 'var(--ink2)'}">${t.slaDue < nowISO() ? 'incumplido' : 'vence ' + rel(t.slaDue).replace('hace', 'en')}</span>`) }, { key: 'createdAt', label: 'Creado', type: 'date', w: 100, noDot: true }, { key: 'csat', label: 'CSAT', type: 'calc', w: 80, get: (t) => (t.csat ? '★'.repeat(t.csat) : '') }],

};
const groupBy = (items, defs, key, order) => (order || Object.keys(defs)).map((k) => ({ key: k, label: defs[k].label, color: defs[k].color, items: items.filter((i) => i[key] === k) }));

/* ---------- Inicio ---------- */
PAGES.inicio = () => {
  const deals = vis('deals'), open = deals.filter((d) => d.status === 'open'); const month = dayISO().slice(0, 7);
  const wonM = deals.filter((d) => d.status === 'won' && (d.closedAt || '').startsWith(month)), lostM = deals.filter((d) => d.status === 'lost' && (d.closedAt || '').startsWith(month));
  const closed90 = deals.filter((d) => d.status !== 'open' && daysBetween(d.closedAt, nowISO()) <= 90); const conv = closed90.length ? Math.round((100 * closed90.filter((d) => d.status === 'won').length) / closed90.length) : 0;
  const leads30 = vis('contacts').filter((c) => daysBetween(c.createdAt, nowISO()) <= 30).length;
  const myT = S.tasks.filter((t) => t.assignee === S.me && t.status !== 'done'); const over = myT.filter((t) => t.due < dayISO()).length, todayN = myT.filter((t) => t.due === dayISO()).length;
  const stale = open.map((d) => ({ d, st: stage(d.stageId), days: daysBetween(d.stageAt, nowISO()) })).filter((x) => x.st && x.days > x.st.days).sort((a, b) => b.days - a.days).slice(0, 6);
  const byStage = S.pipeline.stages.map((s) => ({ label: s.name, v: sumBy(open.filter((d) => d.stageId === s.id), (d) => d.amount), color: s.color }));
  const months = [...Array(6)].map((_, i) => { const d = new Date(); d.setMonth(d.getMonth() - 5 + i); const k = dayISO(d).slice(0, 7); return { label: d.toLocaleDateString('es-ES', { month: 'short' }), v: sumBy(deals.filter((x) => x.status === 'won' && (x.closedAt || '').startsWith(k)), (x) => x.amount), color: C.green }; });
  const lead = S.users.filter((u) => u.active).map((u) => ({ u, n: deals.filter((d) => d.status === 'won' && d.owner === u.id && (d.closedAt || '').startsWith(month)).length, v: sumBy(deals.filter((d) => d.status === 'won' && d.owner === u.id && (d.closedAt || '').startsWith(month)), (d) => d.amount) })).sort((a, b) => b.v - a.v).slice(0, 6);
  const upcoming = open.filter((d) => daysBetween(dayISO(), d.close) <= 14).sort((a, b) => a.close.localeCompare(b.close)).slice(0, 6);
  const h = new Date().getHours(); const greet = h < 13 ? 'Buenos días' : h < 20 ? 'Buenas tardes' : 'Buenas noches';
  setHead({ title: `${greet}, ${esc(me().name.split(' ')[0])}`, desc: `${esc(S.settings.company)} · ${new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' })} · rol ${myRole().label}`, toolbar: `<button class="btn primary" data-act="new-deal">${ico.plus}Nuevo negocio</button><button class="btn" data-act="new-contact">${ico.plus}Contacto</button><button class="btn" data-act="new-task">${ico.plus}Tarea</button><span class="right muted small">Datos guardados en este navegador · <a href="#" data-act="reset-demo">restablecer demo</a></span>` });
  document.getElementById('content').innerHTML = `<div class="kpis">
    <div class="kpi" data-go="#/negocios"><div class="l">Pipeline abierto</div><div class="v num">${money(sumBy(open, (d) => d.amount))}</div><div class="s">${open.length} negocios · ponderado ${money(sumBy(open, (d) => d.amount * d.prob / 100))}</div></div>
    <div class="kpi"><div class="l">Ganado este mes</div><div class="v num" style="color:var(--c-green)">${money(sumBy(wonM, (d) => d.amount))}</div><div class="s">${wonM.length} ganados · ${lostM.length} perdidos (${money(sumBy(lostM, (d) => d.amount))})</div></div>
    <div class="kpi"><div class="l">Conversión (90 días)</div><div class="v num">${conv}%</div><div class="s">ganados / cerrados</div></div>
    <div class="kpi" data-go="#/mi-dia"><div class="l">Nuevos leads (30 d)</div><div class="v num">${leads30}</div><div class="s">${over ? `<span style="color:var(--c-red)">${over} tareas vencidas</span>` : 'sin tareas vencidas'} · ${todayN} para hoy</div></div></div>
  <div class="charts"><div class="chart"><h3>Pipeline por etapa</h3>${barsHtml(byStage, { money: true })}</div><div class="chart"><h3>Ganado por mes</h3>${barsHtml(months, { money: true })}</div>
  <div class="chart"><h3>Negocios estancados <span class="tag" style="background:#fff3e0;color:#b36b00">${stale.length}</span></h3>${stale.length ? stale.map((x) => `<div class="rel"><a href="#/negocios/${x.d.id}" class="grow ell">${esc(x.d.name)}</a><span class="xs muted">${esc(x.st.name)} · ${x.days} d (esperado ${x.st.days})</span><b class="num small">${money(x.d.amount)}</b></div>`).join('') : '<p class="muted small">Ningún negocio supera el tiempo esperado en su etapa.</p>'}</div>
  <div class="chart"><h3>Cierres próximos (14 días)</h3>${upcoming.length ? upcoming.map((d) => `<div class="rel"><a href="#/negocios/${d.id}" class="grow ell">${esc(d.name)}</a><span class="xs muted">${fdate(d.close)} · ${d.prob}%</span><b class="num small">${money(d.amount)}</b></div>`).join('') : '<p class="muted small">Nada previsto en dos semanas.</p>'}</div>
  <div class="chart"><h3>Ranking del mes</h3>${lead.map((x, i) => `<div class="rel"><span class="muted small">${i + 1}</span>${avatarOf(x.u.id, 'sm')}<span class="grow">${esc(x.u.name)}</span><span class="num small">${x.n} · ${money(x.v)}</span></div>`).join('')}</div>
  <div class="chart"><h3>Últimas notificaciones</h3>${S.notifs.filter((n) => n.to === S.me).slice(0, 5).map((n) => `<div class="rel" data-go="${n.link}" style="cursor:pointer"><span class="grow"><b class="small">${esc(n.title)}</b><div class="xs muted">${esc(n.body || '')}</div></span><span class="xs muted">${rel(n.at)}</span></div>`).join('') || '<p class="muted small">Nada nuevo.</p>'}</div></div>`;
};
/* ---------- Mi día ---------- */
PAGES['mi-dia'] = () => {
  const mine = S.tasks.filter((t) => t.assignee === S.me); const today = dayISO(), week = dayISO(addDays(7));
  const groups = [{ key: 'over', label: 'Vencidas', color: C.red, items: mine.filter((t) => t.status !== 'done' && t.due < today) }, { key: 'today', label: 'Hoy', color: C.blue, items: mine.filter((t) => t.status !== 'done' && t.due === today) }, { key: 'week', label: 'Próximos 7 días', color: C.purple, items: mine.filter((t) => t.status !== 'done' && t.due > today && t.due <= week) }, { key: 'later', label: 'Más adelante', color: C.grey, items: mine.filter((t) => t.status !== 'done' && t.due > week) }, { key: 'done', label: 'Completadas hoy', color: C.green, items: mine.filter((t) => t.status === 'done' && (t.doneAt || '').startsWith(today)) }];
  const meetings = S.activities.filter((a) => a.type === 'meeting' && a.user === S.me && a.at >= nowISO() && daysBetween(nowISO(), a.at) <= 7);
  setHead({ title: 'Mi día', desc: `${plural(groups[0].items.length + groups[1].items.length, 'tarea', 'tareas')} para hoy${groups[0].items.length ? `, ${groups[0].items.length} vencidas` : ''} · ${groups[4].items.length} completadas hoy`, toolbar: boardToolbar('tasks', COLS.tasks(), { newLabel: 'Nueva tarea', newAct: 'new-task' }) });
  document.getElementById('content').innerHTML = (meetings.length ? `<div class="card mt8"><h3>Agenda próximos 7 días</h3>${meetings.map((m) => `<div class="rel">${ico.cal}<span class="grow">${esc(m.subject)}</span><span class="small muted">${fdt(m.at)}</span></div>`).join('')}</div>` : '') + boardTable({ obj: 'tasks', cols: COLS.tasks(), groups, addLabel: 'Añadir tarea', onAddAct: 'add-task-row' });
};
ACT['add-task-row'] = ({ group, name }) => { const due = { over: dayISO(addDays(-1)), today: dayISO(), week: dayISO(addDays(3)), later: dayISO(addDays(14)), todo: dayISO(addDays(1)), doing: dayISO(), done: dayISO() }[group] || dayISO(addDays(1)); const t = createTask({ title: name, due }); if (group === 'doing') t.status = 'doing'; if (group === 'done') completeTask(t); refresh(); };
/* ---------- Contactos ---------- */
PAGES.contactos = () => {
  const view = S.ui.view.contactos || 'table'; const items = vis('contacts');
  const groups = groupBy(items, LIFECYCLE, 'lifecycle', ['lead', 'mql', 'sql', 'opportunity', 'customer', 'subscriber', 'evangelist', 'lost']).filter((g) => g.items.length || ['lead', 'mql', 'sql', 'customer'].includes(g.key));
  setHead({ title: 'Contactos', desc: `${items.length} personas · leads, oportunidades y clientes. Perfil 360 al pulsar el nombre.`, views: [{ key: 'table', label: 'Tabla principal', icon: 'table' }, { key: 'kanban', label: 'Kanban', icon: 'kanban' }, { key: 'dups', label: 'Duplicados', icon: 'merge' }], view, toolbar: boardToolbar('contacts', COLS.contacts(), { newLabel: 'Nuevo contacto', newAct: 'new-contact', extra: `<button class="btn" data-act="import" data-arg="contacts">${ico.up}Importar</button>` }) });
  const c = document.getElementById('content');
  if (view === 'table') c.innerHTML = boardTable({ obj: 'contacts', cols: COLS.contacts(), groups, addLabel: 'Añadir contacto', onAddAct: 'add-contact-row' });
  else if (view === 'kanban') c.innerHTML = kanbanHtml({ obj: 'contacts', laneKey: 'lifecycle', lanes: groups.map((g) => ({ ...g, items: applyFilters('contacts', COLS.contacts(), g.items) })), card: (it) => `<div class="t">${esc(contactName(it))}</div><div class="m"><span>${esc(byId('companies', it.companyId)?.name || it.email || '')}</span>${pill(LEAD_STATUS, it.leadStatus, 'display:inline-flex;width:auto;min-height:20px;padding:0 8px;border-radius:3px;font-size:11px')}${avatarOf(it.owner, 'sm')}</div>` });
  else c.innerHTML = dupsHtml();
  if (route.id) { const it = byId('contacts', route.id); if (it) openPanel('contacts', it.id); }
};
ACT['add-contact-row'] = ({ group, name }) => { const [firstName, ...rest] = name.split(' '); createContact({ firstName, lastName: rest.join(' '), lifecycle: ['lead', 'mql', 'sql', 'opportunity', 'customer', 'subscriber', 'evangelist', 'lost'].includes(group) ? group : 'lead' }, { force: true }); refresh(); };
function dupsHtml() {

ACT.merge = async ({ keep, drop }) => { const a = byId('contacts', keep), b = byId('contacts', drop); if (!(await ask('¿Fusionar contactos?', 'Las actividades, negocios y tareas pasan al contacto conservado. Se puede deshacer.', 'Fusionar'))) return; const snap = JSON.parse(JSON.stringify({ a, b })); for (const k of ['email', 'phone', 'jobTitle', 'companyId', 'city', 'linkedin', 'birthday']) if (!a[k] && b[k]) a[k] = b[k]; a.tags = [...new Set([...(a.tags || []), ...(b.tags || [])])]; S.activities.forEach((x) => { if (x.contactId === b.id) x.contactId = a.id; }); S.tasks.forEach((x) => { if (x.contactId === b.id) x.contactId = a.id; }); S.tickets.forEach((x) => { if (x.contactId === b.id) x.contactId = a.id; }); S.deals.forEach((d) => { if (d.contactIds.includes(b.id)) d.contactIds = [...new Set(d.contactIds.map((x) => (x === b.id ? a.id : x)))]; }); S.emails.forEach((x) => { if (x.contactId === b.id) x.contactId = a.id; }); S.contacts = S.contacts.filter((c) => c.id !== b.id); S.merges.unshift({ id: uid(), at: nowISO(), snap, keepName: contactName(a), dropName: contactName(b) }); audit('contacts', a.id, 'merge', { fusionado: contactName(b) }); sysNote(`Fusionado con ${contactName(b)}`, { contactId: a.id }); toast('Contactos fusionados', 'ok'); refresh(); };

s="xs muted mt12">Borrador: envíalo desde el negocio para que el cliente pueda verlo.</p>` : ''}<div class="row mt8"><span class="xs muted">Vistas: ${q.views}${q.signer ? ` · Firmado por ${esc(q.signer)} el ${fdt(q.decidedAt)}` : ''}</span><button class="btn sm right" onclick="window.print()">Imprimir / PDF</button></div></div></div>`, footer: '' }); if (['sent', 'viewed'].includes(q.status)) { const d2 = byId('deals', q.dealId); if (q.status === 'sent') { q.status = 'viewed'; } q.views++; q.viewedAt = nowISO(); notify(d2.owner, `Presupuesto ${q.number} visto (${q.views} ${q.views === 1 ? 'vez' : 'veces'})`, d2.name, `#/negocios/${d2.id}`, 'email'); sysNote(`Presupuesto ${q.number} visto por el cliente`, { dealId: d2.id }); emit('quote_viewed', 'deals', d2); save(); m.querySelector('#acc').onclick = () => { const s = m.querySelector('#signer').value.trim(); if (!s) return toast('Indica el nombre del firmante', 'err'); q.status = 'accepted'; q.signer = s; q.decidedAt = nowISO(); audit('quotes', q.id, 'update', { estado: ['viewed', 'accepted'], firmante: s }); sysNote(`Presupuesto ${q.number} aceptado por ${s} (${money2(q.total)})`, { dealId: d2.id }); notify(d2.owner, `Presupuesto ${q.number} aceptado`, `${d2.name} · ${money2(q.total)}`, `#/negocios/${d2.id}`, 'ok'); if (S.settings.quoteAcceptStage && d2.status === 'open' && d2.stageId !== S.settings.quoteAcceptStage) moveStage(d2, S.settings.quoteAcceptStage, true); emit('quote_accepted', 'deals', d2); m.close(); toast('Presupuesto aceptado', 'ok'); refresh(); if (PANEL) renderPanel(); }; m.querySelector('#rej').onclick = () => { q.status = 'rejected'; q.decidedAt = nowISO(); sysNote(`Presupuesto ${q.number} rechazado`, { dealId: d2.id }); m.close(); refresh(); if (PANEL) renderPanel(); }; } };

const opts = (def, sel) => Object.entries(def).map(([k, o]) => `<option value="${k}" ${sel === k ? 'selected' : ''}>${o.label}</option>`).join('');
function contactForm(d) { if (!can('edit')) return toast('Solo lectura', 'err'); const m = modal({ title: 'Nuevo contacto', size: 'lg', body: `<div class="fgrid"><div class="fld"><label>Nombre *</label><input class="inp" id="fn"/></div><div class="fld"><label>Apellidos</label><input class="inp" id="ln"/></div><div class="fld"><label>Email</label><input class="inp" id="em" type="email"/></div><div class="fld"><label>Teléfono</label><input class="inp" id="ph"/></div><div class="fld"><label>Cargo</label><input class="inp" id="jt"/></div><div class="fld"><label>Empresa</label>${companySel('co', d.companyId)}</div><div class="fld"><label>…o nueva empresa</label><input class="inp" id="cn" placeholder="Se crea al guardar"/></div><div class="fld"><label>Origen</label><select class="inp" id="src">${opts(SOURCES, 'referral')}</select></div><div class="fld"><label>Ciclo de vida</label><select class="inp" id="lc">${opts(LIFECYCLE, 'lead')}</select></div><div class="fld"><label>Propietario</label>${userSel('ow', S.me)}</div><label class="chk full"><input type="checkbox" id="cs"/>Consentimiento de marketing (RGPD)</label><div id="dup" class="full"></div></div>`, footer: `<button class="btn primary" id="ok">Crear contacto</button>` }); const go_ = (force) => { const fn = m.querySelector('#fn').value.trim(); if (!fn) return toast('El nombre es obligatorio', 'err'); const data = { firstName: fn, lastName: m.querySelector('#ln').value, email: m.querySelector('#em').value, phone: m.querySelector('#ph').value, jobTitle: m.querySelector('#jt').value, companyId: m.querySelector('#co').value || null, companyName: m.querySelector('#cn').value.trim() || null, source: m.querySelector('#src').value, lifecycle: m.querySelector('#lc').value, owner: m.querySelector('#ow').value || null, consent: m.querySelector('#cs').checked }; const r = createContact(data, { force, returnDup: true }); if (r.dup) { m.querySelector('#dup').innerHTML = `<div class="card" style="background:#fff6e5"><b>Puede que ya exista:</b> <a href="#/contactos/${r.dup.id}">${esc(contactName(r.dup))}</a> (mismo email). <button class="btn sm outline" id="force">Crear de todos modos</button></div>`; m.querySelector('#force').onclick = () => go_(true); return; } m.close(); toast('Contacto creado', 'ok'); go(`#/contactos/${r.id}`); }; m.querySelector('#ok').onclick = () => go_(false); }
function companyForm(d) { if (!can('edit')) return toast('Solo lectura', 'err'); const m = modal({ title: 'Nueva empresa', body: `<div class="fgrid"><div class="fld full"><label>Nombre *</label><input class="inp" id="n"/></div><div class="fld"><label>Dominio</label><input class="inp" id="dm" placeholder="empresa.com"/></div><div class="fld"><label>Sector</label><input class="inp" id="se"/></div><div class="fld"><label>Tipo</label><select class="inp" id="ty">${opts(COMPANY_TYPE, 'prospect')}</select></div><div class="fld"><label>Empleados</label><input class="inp" id="sz" type="number"/></div><div class="fld"><label>Ciudad</label><input class="inp" id="ci"/></div><div class="fld"><label>Propietario</label>${userSel('ow', S.me)}</div></div>`, footer: `<button class="btn primary" id="ok">Crear empresa</button>` }); m.querySelector('#ok').onclick = () => { const n = m.querySelector('#n').value.trim(); if (!n) return toast('El nombre es obligatorio', 'err'); if (S.companies.some((c) => norm(c.name) === norm(n))) return toast('Ya existe una empresa con ese nombre', 'err'); const c = createCompany({ name: n, domain: m.querySelector('#dm').value, sector: m.querySelector('#se').value, type: m.querySelector('#ty').value, size: Number(m.querySelector('#sz').value) || null, city: m.querySelector('#ci').value, owner: m.querySelector('#ow').value || null }); m.close(); go(`#/empresas/${c.id}`); }; }
function dealForm(d) { if (!can('edit')) return toast('Solo lectura', 'err'); const m = modal({ title: 'Nuevo negocio', body: `<div class="fgrid"><div class="fld full"><label>Nombre *</label><input class="inp" id="n" value="${esc(d.name || '')}" placeholder="Empresa · Oportunidad"/></div><div class="fld"><label>Empresa</label>${companySel('co', d.companyId)}</div><div class="fld"><label>Contacto principal</label><select class="inp" id="ct"><option value="">—</option>${S.contacts.map((c) => `<option value="${c.id}" ${(d.contactIds || [])[0] === c.id ? 'selected' : ''}>${esc(contactName(c))}</option>`).join('')}</select></div><div class="fld"><label>Etapa</label><select class="inp" id="st">${S.pipeline.stages.map((s) => `<option value="${s.id}">${esc(s.name)} (${s.prob}%)</option>`).join('')}</select></div><div class="fld"><label>Importe</label><input class="inp" id="am" type="number" value="0"/></div><div class="fld"><label>Cierre previsto</label><input class="inp" id="cl" type="date" value="${dayISO(addDays(30))}" min="${dayISO()}"/></div><div class="fld"><label>Propietario</label>${userSel('ow', S.me)}</div><div class="fld"><label>Prioridad</label><select class="inp" id="pr">${opts(PRIORITY, 'normal')}</select></div></div>`, footer: `<button class="btn primary" id="ok">Crear negocio</button>` }); m.querySelector('#ok').onclick = () => { const n = m.querySelector('#n').value.trim(); if (!n) return toast('El nombre es obligatorio', 'err'); const close = m.querySelector('#cl').value; if (close < dayISO()) return toast('La fecha de cierre no puede ser anterior a hoy', 'err'); const dl = createDeal({ name: n, companyId: m.querySelector('#co').value || null, contactIds: m.querySelector('#ct').value ? [m.querySelector('#ct').value] : [], stageId: m.querySelector('#st').value, amount: Number(m.querySelector('#am').value), close, owner: m.querySelector('#ow').value || null, priority: m.querySelector('#pr').value }); m.close(); go(`#/negocios/${dl.id}`); }; }
function taskForm(d) { if (!can('edit')) return toast('Solo lectura', 'err'); const m = modal({ title: 'Nueva tarea', body: `<div class="fgrid"><div class="fld full"><label>Título *</label><input class="inp" id="t" value="${esc(d.title || '')}"/></div><div class="fld"><label>Tipo</label><select class="inp" id="ty">${opts(TASK_TYPE, 'followup')}</select></div><div class="fld"><label>Prioridad</label><select class="inp" id="pr">${opts(PRIORITY, 'normal')}</select></div><div class="fld"><label>Vence</label><input class="inp" id="du" type="date" value="${dayISO(addDays(1))}"/></div><div class="fld"><label>Asignada a</label>${userSel('as', S.me)}</div><div class="fld"><label>Repetir</label><select class="inp" id="re"><option value="">No</option><option value="daily">Cada día</option><option value="weekly">Cada semana</option><option value="monthly">Cada mes</option></select></div><div class="fld"><label>Negocio</label><select class="inp" id="dl"><option value="">—</option>${S.deals.filter((x) => x.status === 'open').map((x) => `<option value="${x.id}" ${d.dealId === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div><div class="fld full"><label>Contacto</label><select class="inp" id="ct"><option value="">—</option>${S.contacts.map((c) => `<option value="${c.id}" ${d.contactId === c.id ? 'selected' : ''}>${esc(contactName(c))}</option>`).join('')}</select></div></div>`, footer: `<button class="btn primary" id="ok">Crear tarea</button>` }); m.querySelector('#ok').onclick = () => { const t = m.querySelector('#t').value.trim(); if (!t) return toast('Indica el título', 'err'); createTask({ title: t, type: m.querySelector('#ty').value, priority: m.querySelector('#pr').value, due: m.querySelector('#du').value, assignee: m.querySelector('#as').value || null, recurrence: m.querySelector('#re').value || null, dealId: m.querySelector('#dl').value || d.dealId || null, contactId: m.querySelector('#ct').value || d.contactId || null, companyId: d.companyId || null, ticketId: d.ticketId || null }); m.close(); toast('Tarea creada', 'ok'); refresh(); if (PANEL) renderPanel(); }; }
function ticketForm(d) { if (!can('edit')) return toast('Solo lectura', 'err'); const m = modal({ title: 'Nuevo ticket', body: `<div class="fgrid"><div class="fld full"><label>Asunto *</label><input class="inp" id="s"/></div><div class="fld"><label>Contacto</label><select class="inp" id="ct"><option value="">—</option>${S.contacts.map((c) => `<option value="${c.id}">${esc(contactName(c))}</option>`).join('')}</select></div><div class="fld"><label>Prioridad</label><select class="inp" id="pr">${opts(PRIORITY, 'normal')}</select></div><div class="fld"><label>Canal</label><select class="inp" id="ch"><option>email</option><option>teléfono</option><option>formulario</option><option>chat</option><option>manual</option></select></div><div class="fld"><label>Categoría</label><input class="inp" id="ca" placeholder="Técnico, Facturación…"/></div><div class="fld"><label>Agente</label>${userSel('as', S.me)}</div><div class="fld full"><label>Descripción</label><textarea class="inp" id="de"></textarea></div></div>`, footer: `<button class="btn primary" id="ok">Crear ticket</button>` }); m.querySelector('#ok').onclick = () => { const s = m.querySelector('#s').value.trim(); if (!s) return toast('Indica el asunto', 'err'); const t = createTicket({ subject: s, contactId: m.querySelector('#ct').value || null, priority: m.querySelector('#pr').value, channel: m.querySelector('#ch').value, category: m.querySelector('#ca').value, assignee: m.querySelector('#as').value || null, description: m.querySelector('#de').value }); m.close(); go(`#/tickets/${t.id}`); }; }
</script>
<script>
/* ============================================================
   Ajustes, importación, búsqueda global, notificaciones,
   cambio de usuario, datos de demostración e inicio
   ============================================================ */
PAGES.ajustes = () => {
  const tab = route.id || 'general'; const tabs = [['general', 'General'], ['usuarios', 'Usuarios y equipos'], ['roles', 'Roles y permisos'], ['pipeline', 'Pipeline y etapas'], ['campos', 'Campos personalizados'], ['plantillas', 'Plantillas de email'], ['scoring', 'Lead scoring'], ['auditoria', 'Auditoría'], ['papelera', 'Papelera'], ['importar', 'Importar CSV'], ['rgpd', 'RGPD'], ['datos', 'Datos y copia']];
  setHead({ title: 'Ajustes', desc: 'Configuración del CRM. Algunas secciones requieren rol de administrador.', toolbar: `<div class="stabs">${tabs.map(([k, l]) => `<button class="${tab === k ? 'active' : ''}" data-go="#/ajustes/${k}">${l}</button>`).join('')}</div>` });
  const adm = can('admin'); const lock = adm ? '' : '<div class="card mb12" style="background:#fff6e5">Solo un administrador puede modificar esta sección (puedes verla).</div>'; let h = '';
  const s = S.settings;
  if (tab === 'general') h = `${lock}<div class="card"><h3>Empresa</h3><div class="fgrid"><div class="fld"><label>Nombre</label><input class="inp" data-set="company" value="${esc(s.company)}"/></div><div class="fld"><label>Moneda (ISO)</label><input class="inp" data-set="currency" value="${esc(s.currency)}" maxlength="3"/></div><div class="fld"><label>Prefijo telefónico</label><input class="inp" data-set="cc" value="${esc(s.cc)}"/></div><div class="fld"><label>Prefijo de presupuestos</label><input class="inp" data-set="quotePrefix" value="${esc(s.quotePrefix)}"/></div></div></div><div class="card mt12"><h3>Reglas comerciales</h3><div class="fgrid"><div class="fld"><label>Negocio inactivo tras (días sin actividad)</label><input class="inp" type="number" data-set="inactiveDays" value="${s.inactiveDays}"/></div><div class="fld"><label>SLA de primer contacto a leads (horas)</label><input class="inp" type="number" data-set="leadSlaHours" value="${s.leadSlaHours}"/></div><div class="fld"><label>Umbral MQL (puntos)</label><input class="inp" type="number" data-set="mqlThreshold" value="${s.mqlThreshold}"/></div><div class="fld"><label>Umbral SQL (puntos)</label><input class="inp" type="number" data-set="sqlThreshold" value="${s.sqlThreshold}"/></div><div class="fld full"><label>Al aceptar un presupuesto, mover el negocio a</label><select class="inp" data-set="quoteAcceptStage"><option value="">No mover</option>${S.pipeline.stages.map((x) => `<option value="${x.id}" ${s.quoteAcceptStage === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div></div></div><div class="card mt12"><h3>SLA de tickets (horas hasta primera respuesta)</h3><div class="fgrid">${Object.entries(PRIORITY).map(([k, o]) => `<div class="fld"><label>${o.label}</label><input class="inp" type="number" data-sla="${k}" value="${s.sla[k]}"/></div>`).join('')}</div></div><div class="card mt12"><h3>Email saliente</h3><p class="small muted">Esta demo no envía correos reales: cada envío se registra en la línea temporal y se simula la apertura a los pocos segundos (seguimiento de aperturas). En la versión servidor se configura SMTP y se sincronizan los buzones de Gmail / Microsoft 365.</p></div>`;
  if (tab === 'usuarios') h = `${lock}<div class="card"><div class="row mb12"><h3 class="grow" style="margin:0">Usuarios</h3>${adm ? `<button class="btn primary sm" data-act="user-new">${ico.plus}Nuevo usuario</button>` : ''}</div><table class="t"><thead><tr><th>Usuario</th><th>Email</th><th>Rol</th><th>Equipo</th><th class="r">Cuota mensual</th><th>Estado</th><th></th></tr></thead><tbody>${S.users.map((u) => `<tr><td class="row">${avatarOf(u.id, 'sm')}<b>${esc(u.name)}</b>${u.id === S.me ? '<span class="tag">tú</span>' : ''}</td><td>${esc(u.email)}</td><td>${adm ? `<select class="inp" data-urole="${u.id}" style="min-height:30px;padding:3px 8px">${Object.entries(ROLES).map(([k, r]) => `<option value="${k}" ${u.role === k ? 'selected' : ''}>${r.label}</option>`).join('')}</select>` : ROLES[u.role].label}</td><td>${esc(teamOf(u.id)?.name || '—')}</td><td class="r">${u.quota ? money(u.quota) : '—'}</td><td>${u.active ? '<span class="tag" style="background:#e6f8ef;color:#0a7b47">activo</span>' : '<span class="tag">desactivado</span>'}</td><td class="r">${adm && u.id !== S.me ? `<button class="btn sm outline" data-act="user-toggle" data-arg="${u.id}">${u.active ? 'Desactivar' : 'Activar'}</button>` : ''}<button class="btn sm" data-act="switch-user" data-arg="${u.id}" title="Simular inicio de sesión">Entrar como</button></td></tr>`).join('')}</tbody></table><p class="small muted mt12">«Entrar como» simula el inicio de sesión de otro usuario para ver cómo cambian la visibilidad y los permisos (en la versión servidor hay contraseñas, bloqueo tras 5 intentos y 2FA).</p></div><div class="card mt12"><h3>Equipos</h3>${S.teams.map((t) => `<div class="rel"><b>${esc(t.name)}</b><span class="muted small">manager: ${esc(user(t.manager)?.name || '—')} · ${t.members.map((m) => user(m)?.name.split(' ')[0]).join(', ')}</span></div>`).join('')}<p class="small muted mt8">Un manager ve los registros de su equipo; un comercial solo los suyos; soporte y lectura ven todo.</p></div>`;
  if (tab === 'roles') h = `<div class="card"><h3>Roles y permisos</h3><table class="t"><thead><tr><th>Rol</th><th>Visibilidad de registros</th><th>Puede editar</th><th>Administración</th><th class="r">Usuarios</th></tr></thead><tbody>${Object.entries(ROLES).map(([k, r]) => `<tr><td class="b">${r.label}</td><td>${{ all: 'Todos', team: 'Su equipo', own: 'Solo los suyos' }[r.vis]}</td><td>${r.edit ? '✓' : '—'}</td><td>${r.admin ? '✓ ajustes, usuarios, columnas, automatizaciones' : '—'}</td><td class="r">${S.users.filter((u) => u.role === k).length}</td></tr>`).join('')}</tbody></table><p class="small muted mt12">Prueba «Entrar como» en Usuarios: Carlos (comercial) solo ve sus negocios; Lucía (manager) ve su equipo; el usuario de solo lectura no puede editar celdas.</p></div>`;
  if (tab === 'pipeline') h = `${lock}<div class="card"><div class="row mb12"><h3 class="grow" style="margin:0">Etapas del pipeline «${esc(S.pipeline.name)}»</h3>${adm ? `<button class="btn primary sm" data-act="stage-add">${ico.plus}Etapa</button>` : ''}</div><table class="t"><thead><tr><th></th><th>Etapa</th><th class="r">Probabilidad</th><th class="r">Días esperados</th><th>Obligatorio para entrar</th><th></th></tr></thead><tbody>${S.pipeline.stages.map((st, i) => `<tr><td><span style="display:inline-block;width:14px;height:14px;border-radius:3px;background:${st.color}"></span></td><td><input class="inp" data-st="${st.id}" data-k="name" value="${esc(st.name)}" ${adm ? '' : 'disabled'}/></td><td class="r"><input class="inp" type="number" data-st="${st.id}" data-k="prob" value="${st.prob}" style="width:80px" ${adm ? '' : 'disabled'}/></td><td class="r"><input class="inp" type="number" data-st="${st.id}" data-k="days" value="${st.days}" style="width:80px" ${adm ? '' : 'disabled'}/></td><td>${[['amount', 'importe'], ['close', 'fecha cierre'], ['contacts', 'contacto decisor'], ['companyId', 'empresa']].map(([f, l]) => `<label class="chk small" style="margin-right:8px"><input type="checkbox" data-req="${st.id}" data-k="${f}" ${(st.required || []).includes(f) ? 'checked' : ''} ${adm ? '' : 'disabled'}/>${l}</label>`).join('')}</td><td class="r">${adm ? `<button class="ibtn" data-act="stage-move" data-arg='${JSON.stringify({ id: st.id, d: -1 })}' ${i === 0 ? 'disabled' : ''}>▲</button><button class="ibtn" data-act="stage-move" data-arg='${JSON.stringify({ id: st.id, d: 1 })}' ${i === S.pipeline.stages.length - 1 ? 'disabled' : ''}>▼</button><button class="ibtn" data-act="stage-del" data-arg="${st.id}">${ico.trash}</button>` : ''}</td></tr>`).join('')}</tbody></table><p class="small muted mt8">Los negocios con campos obligatorios sin rellenar no pueden avanzar a la etapa (ni por arrastre ni por automatización sin «forzar»). Los estados Ganado y Perdido son fijos.</p></div>`;
  if (tab === 'campos') h = `${lock}<div class="card"><h3>Columnas personalizadas</h3><p class="small muted">Se añaden desde el botón «+» de la cabecera de cada tablero. Tipos: texto, número, fecha, estado (etiquetas de colores), casilla y persona. Aparecen en la tabla, en la ficha, en filtros y en la exportación.</p>${['contacts', 'companies', 'deals', 'tickets'].map((o) => `<h3 class="mt12" style="font-size:14px">${OBJ_LABEL[o][0].toUpperCase() + OBJ_LABEL[o].slice(1)}s</h3>${(S.customCols[o] || []).map((c) => `<div class="rel"><b>${esc(c.label)}</b><span class="muted small">${c.type}${c.options?.length ? ' · ' + c.options.map((x) => x.label).join(', ') : ''}</span><button class="ibtn right" data-act="col-del" data-arg='${JSON.stringify({ obj: o, key: c.key })}'>${ico.trash}</button></div>`).join('') || '<p class="xs muted">Ninguna.</p>'}`).join('')}</div>`;
  if (tab === 'plantillas') h = `<div class="card"><div class="row mb12"><h3 class="grow" style="margin:0">Plantillas de email</h3><button class="btn primary sm" data-act="tpl-new">${ico.plus}Nueva plantilla</button></div><p class="small muted mb8">Variables: {{nombre}}, {{apellidos}}, {{empresa}}, {{propietario}}. Se usan al enviar email desde la ficha y en las automatizaciones.</p>${S.templates.map((t) => `<div class="rel"><div class="grow"><b>${esc(t.name)}</b><div class="small muted">${esc(t.subject)}</div></div><button class="btn sm outline" data-act="tpl-edit" data-arg="${t.id}">Editar</button><button class="ibtn" data-act="tpl-del" data-arg="${t.id}">${ico.trash}</button></div>`).join('')}</div>`;
  if (tab === 'scoring') h = `${lock}<div class="card"><h3>Lead scoring</h3><p class="small muted mb8">Puntos por reglas sobre el contacto o su empresa (company.size…). Además: +3 por interacción entrante (máx. 30), +2 por email abierto (máx. 20), −10 por email gratuito, −1 por semana sin actividad. MQL ≥ ${s.mqlThreshold}, SQL ≥ ${s.sqlThreshold}.</p><table class="t"><thead><tr><th>Regla</th><th>Campo</th><th>Operador</th><th>Valor</th><th class="r">Puntos</th><th>Activa</th><th></th></tr></thead><tbody>${S.scoring.map((r) => `<tr><td>${esc(r.label)}</td><td><code>${esc(r.field)}</code></td><td>${r.op}</td><td>${esc(r.value ?? '')}</td><td class="r b">${r.points > 0 ? '+' : ''}${r.points}</td><td><input type="checkbox" ${r.on ? 'checked' : ''} data-act="score-toggle" data-arg="${r.id}" ${adm ? '' : 'disabled'}/></td><td class="r">${adm ? `<button class="ibtn" data-act="score-del" data-arg="${r.id}">${ico.trash}</button>` : ''}</td></tr>`).join('')}</tbody></table>${adm ? `<div class="row wrap mt12"><input class="inp" id="sl" placeholder="Descripción" style="width:180px"/><input class="inp" id="sf" placeholder="campo" value="jobTitle" style="width:130px"/><select class="inp" id="so" style="width:auto"><option>contains</option><option>eq</option><option>gt</option><option>lt</option><option>not_empty</option></select><input class="inp" id="sv" placeholder="valor" style="width:120px"/><input class="inp" id="sp" type="number" value="10" style="width:80px"/><button class="btn primary sm" data-act="score-add">Añadir</button><button class="btn sm outline" data-act="score-recalc">Recalcular todos</button></div>` : ''}</div>`;
  if (tab === 'auditoria') { const rows = S.audit.slice(0, 150); h = `<div class="card"><h3>Registro de auditoría</h3><p class="small muted mb8">Quién cambió qué y cuándo, con valores anterior y nuevo. Incluye creaciones, borrados, exportaciones, fusiones y anonimizaciones.</p><table class="t"><thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Objeto</th><th>Cambios</th></tr></thead><tbody>${rows.map((a) => `<tr><td class="small">${fdt(a.at)}</td><td class="small">${esc(user(a.user)?.name || 'sistema')}</td><td><span class="tag">${a.action}</span></td><td class="small">${a.rid ? `<a href="${linkOf(a.obj, a.rid)}">${esc(itemName(a.obj, a.rid))}</a>` : a.obj}</td><td class="small muted">${Object.entries(a.changes || {}).slice(0, 5).map(([k, v]) => `<b>${esc(k)}</b>: ${Array.isArray(v) ? `${esc(fmtv(v[0]))} → ${esc(fmtv(v[1]))}` : esc(fmtv(v))}`).join(' · ')}</td></tr>`).join('')}</tbody></table></div>`; }
  if (tab === 'papelera') h = `<div class="card"><h3>Papelera</h3><p class="small muted mb8">Los registros borrados se conservan 30 días y se pueden restaurar.</p>${S.trash.map((t) => `<div class="rel"><span class="tag">${OBJ_LABEL[t.obj]}</span><span class="grow">${esc(t.item.name || t.item.title || t.item.subject || contactName(t.item))}</span><span class="small muted">${rel(t.at)} · ${esc(user(t.user)?.name)}</span><button class="btn sm outline" data-act="restore" data-arg="${t.id}">Restaurar</button></div>`).join('') || '<p class="muted">Vacía.</p>'}</div>`;

function parseCSV(text) { const sep = (text.match(/;/g) || []).length > (text.match(/,/g) || []).length ? ';' : ','; const rows = []; let cur = [], val = '', q = false; for (let i = 0; i < text.length; i++) { const ch = text[i]; if (q) { if (ch === '"' && text[i + 1] === '"') { val += '"'; i++; } else if (ch === '"') q = false; else val += ch; } else if (ch === '"') q = true; else if (ch === sep) { cur.push(val); val = ''; } else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; cur.push(val); rows.push(cur); cur = []; val = ''; } else val += ch; } if (val || cur.length) { cur.push(val); rows.push(cur); } const head = (rows.shift() || []).map((h) => norm(h).trim()); return rows.filter((r) => r.some((v) => v.trim())).map((r) => Object.fromEntries(head.map((h, i) => [h, (r[i] || '').trim()]))); }

<script>
/* ============================================================
   Celdas y automatizaciones v2 (manual «monday a fondo»)
   - Celda = {id estable, tipo, valor (verdad), texto (presentación)}
   - Estados por ID de etiqueta: renombrar no reescribe los datos
   - Fórmulas por fila y reflejos (mirror) con agregación declarada,
     que SÍ disparan y condicionan automatizaciones
   - Valoración, línea temporal, botón, autonumeración, registros
   - Valores por defecto y columnas obligatorias por estado
   - Motor: disparadores de X a Y, cualquier columna, sin cambios en
     N días, fecha ± días a una hora (planificador), periódicos,
     botón, subelementos, actualizaciones; condiciones Y/O anidadas;
     ramas, aprobaciones y esperas; propietario y usuario de servicio;
     protección de bucles; contabilidad de acciones y presupuesto;

'use strict';
const NOW_V = () => Date.now() + ((S.autoV2 && S.autoV2.clock) || 0) * 864e5;

const monthKey = () => new Date(NOW_V()).toISOString().slice(0, 7);

  S.autoV2 = S.autoV2 || { budget: 1000, mode: 'block_edit', maxDepth: 10, usage: {}, alerts: {}, schedule: [], approvals: [], clock: 0, fcache: {} };

  for (const [obj, cols] of Object.entries(S.customCols)) for (const c of cols) {
    if (c.type !== 'status' || (c.options || []).every((o) => o.id)) continue;
    c.options = (c.options || []).map((o, i) => ({ id: i + 1, label: o.label, color: o.color, done: !!o.done }));
    for (const it of S[obj] || []) { const v = (it.custom || {})[c.key]; if (v != null && v !== '') { const hit = c.options.find((o) => o.label === v); it.custom[c.key] = hit ? hit.id : null; } }
  }
  if (!S.autoV2.seeded) { seedAutoV2(); S.autoV2.seeded = true; }
}

}
document.getElementById('tutBtn').onclick = () => { const el = document.getElementById('tut'); el.classList.toggle('open'); tutDrawPanel(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { tutHide(); document.getElementById('tut').classList.remove('open'); } });
tutDrawPanel();
if (!localStorage.getItem(TUT_KEY)) {
  const m = modal({ title: 'Bienvenido a la demo del CRM', size: 'lg', body: `<div class="welcome"><p>Un CRM completo y <b>totalmente personalizable</b>, con la estética de monday: tableros con grupos de color, celdas editables, columnas y etiquetas a medida, kanban con etapas configurables y reglas «cuando… entonces…». Los datos son de ejemplo y se guardan en tu navegador.</p><div class="feat"><div><b>Tableros</b>Contactos, empresas, pipeline, tareas, tickets, productos y presupuestos.</div><div><b>Personalización</b>Columnas nuevas, etiquetas y colores, grupos, etapas del pipeline.</div><div><b>Automatizaciones</b>Reglas por tablero y editor completo con condiciones.</div><div><b>Roles</b>Cambia de usuario para ver permisos y visibilidad.</div></div><p class="small muted">El tutorial te lleva por ${STEPS.length} pasos cortos y resalta cada elemento en pantalla. Puedes retomarlo cuando quieras desde el botón «Tutorial».</p></div>`, footer: `<button class="btn outline" id="wExplore">Explorar por mi cuenta</button><button class="btn primary" id="wStart">Empezar el tutorial</button>` });
  m.querySelector('#wExplore').onclick = () => { tutSave(); m.close(); };
  m.querySelector('#wStart').onclick = () => { m.close(); tutShow(0); };
}
</script>
