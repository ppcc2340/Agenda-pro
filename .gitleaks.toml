# gitleaks configuration (docs/12 §8). Extends the default rules; dev-only placeholders are allow-listed.
[extend]
useDefault = true

[allowlist]
description = "Example configuration and documented dev placeholders"
paths = [
  '''meri/\.env\.example$''',
]
regexes = [
  '''change-me-dev-only''',
  '''meri_app:meri_app@localhost''',
  '''meri:meri@localhost''',
  # Fake fixtures in tests committed before they were rewritten (kept in history; never real credentials).
  '''sk_test_SECRETVALUE''',
  '''internal-secret-1234567890''',
]
